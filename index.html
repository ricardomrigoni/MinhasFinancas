<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Financeiro Pessoal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0F1B2D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='8' fill='%230B6B58'/%3E%3Crect x='7' y='16' width='4' height='8' rx='1.5' fill='%23fff' opacity='.55'/%3E%3Crect x='13' y='11' width='4' height='13' rx='1.5' fill='%23fff' opacity='.8'/%3E%3Crect x='19' y='6' width='4' height='18' rx='1.5' fill='%23D9BC82'/%3E%3C/svg%3E">
<style>/* Identidade visual: tinta e esmeralda, com latão como detalhe.
   Fraunces (serifa suave, números lining) para títulos e valores; Figtree (sans geométrica) para o resto. */
:root{
  --bg:#EDF0F4;--panel:#FFFFFF;--panel2:#F5F7FA;--ink:#0F1B2D;--muted:#5D6C80;--line:#DDE3EA;--line2:#C7D0DB;
  --accent:#0B6B58;--accent-ink:#FFFFFF;--pos:#0E7C5F;--neg:#B3364D;--warn:#B57616;--inv:#5747B8;--brass:#B08D4F;--focus:rgba(11,107,88,.22);
  --c1:#0B6B58;--c2:#5747B8;--c3:#1F7FA6;--c4:#B08D4F;--c5:#B3364D;--c6:#7A8BA0;--c7:#A79BE3;--c8:#7ECDB3;--c9:#D19A2F;
  --side:#0F1B2D;--side2:#182A45;--side-ink:#C9D3E0;--side-mut:#8494AB;
  --sh:0 1px 0 rgba(15,27,45,.03),0 14px 30px -20px rgba(15,27,45,.22);
  --f-display:'Fraunces','Iowan Old Style','Georgia',serif;--f-body:'Figtree','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0A1220;--panel:#111C2E;--panel2:#16233A;--ink:#E7EDF6;--muted:#93A3BA;--line:#22324A;--line2:#2E415E;
  --accent:#3FBFA0;--accent-ink:#06231C;--pos:#45CDA2;--neg:#F0798D;--warn:#E3B04B;--inv:#A99DF3;--brass:#D3B47C;--focus:rgba(63,191,160,.28);
  --c1:#3FBFA0;--c2:#A99DF3;--c3:#5DB6DB;--c4:#D3B47C;--c5:#F0798D;--c6:#8C9DB4;--c7:#6F63C9;--c8:#2E8C74;--c9:#E3B04B;
  --side:#070E1A;--side2:#122038;--side-ink:#C9D3E0;--side-mut:#7C8CA4;
  --sh:0 1px 0 rgba(0,0,0,.25),0 14px 30px -20px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;font-feature-settings:"lnum" 1,"tnum" 1;font-variant-numeric:lining-nums tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--focus)}
.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
/* ---- menu lateral ---- */
aside{background:var(--side);color:var(--side-ink);padding:26px 14px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:auto;border-right:1px solid rgba(255,255,255,.04)}
.brand{display:flex;gap:12px;align-items:center;padding:0 10px 26px}
.brand svg{flex:none}
.brand b{display:block;font-family:var(--f-display);font-weight:500;font-size:19px;letter-spacing:-.01em;color:#fff;line-height:1.15}
.brand small{display:block;font-size:11.5px;color:var(--side-mut);margin-top:3px;line-height:1.3}
nav{display:flex;flex-direction:column;gap:2px}
nav button{background:none;border:0;text-align:left;padding:10px 12px 10px 14px;cursor:pointer;border-radius:10px;color:var(--side-ink);font-weight:500;font-size:14.5px;display:flex;align-items:center;gap:11px;transition:background .15s,color .15s}
nav button::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--side-mut);opacity:.55;flex:none;transition:.15s}
nav button:hover{background:rgba(255,255,255,.05);color:#fff}
nav button[aria-current=page]{background:var(--side2);color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
nav button[aria-current=page]::before{background:var(--brass);opacity:1;box-shadow:0 0 0 3px rgba(176,141,79,.22)}
nav .sep{font-size:12px;color:var(--side-mut);padding:16px 14px 6px}
.side-foot{margin-top:auto;padding:18px 10px 0;font-size:12px;color:var(--side-mut);border-top:1px solid rgba(255,255,255,.07)}
.side-foot .btn{margin-top:10px;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:var(--side-ink)}
.side-foot .btn:hover{border-color:var(--brass);color:#fff}
/* ---- conteúdo ---- */
main{padding:30px 36px 70px;min-width:0;max-width:1560px}
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
h1{font-family:var(--f-display);font-size:32px;margin:0;letter-spacing:-.02em;font-weight:500;line-height:1.15;font-optical-sizing:auto}
h2{font-family:var(--f-display);font-size:19px;margin:0 0 4px;letter-spacing:-.01em;font-weight:500;line-height:1.25}
h3{font-family:var(--f-display);font-weight:500}
.sub{color:var(--muted);font-size:13.5px;margin:4px 0 0;max-width:88ch}
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);gap:2px}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);border-radius:9px;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--panel);font-weight:600;box-shadow:0 1px 3px rgba(15,27,45,.25)}
.chk{display:inline-flex;gap:7px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:15px;height:15px}
input[type=text],input[type=number],input[type=month],input[type=date],select,input[type=search],textarea{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:7px 10px;min-width:0;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}
input[type=number]{width:125px;text-align:right}
input[type=range]{accent-color:var(--accent)}
.btn{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px 15px;cursor:pointer;font-weight:600;font-size:14px;transition:border-color .15s,background .15s,box-shadow .15s}
.btn:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--neg)}.btn.danger:hover{border-color:var(--neg);box-shadow:0 0 0 3px color-mix(in srgb,var(--neg) 22%,transparent)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;min-width:0;box-shadow:var(--sh)}
.grid{display:grid;gap:18px;margin-bottom:18px}
.g2{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
/* ---- faixa de indicadores ---- */
.ledger{display:grid;grid-template-columns:1.35fr repeat(4,1fr);border:1px solid var(--line);border-radius:18px;background:var(--panel);margin-bottom:18px;overflow:hidden;box-shadow:var(--sh)}
.ledger>div{padding:20px 22px;border-right:1px solid var(--line);min-width:0}
.ledger>div:last-child{border-right:0}
.ledger .lab{font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.ledger .num{font-family:var(--f-display);font-size:25px;font-weight:500;letter-spacing:-.02em;line-height:1.12;white-space:nowrap;font-optical-sizing:auto}
.ledger .note{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.45}
.ledger .hero{background:var(--side);color:#fff;position:relative;border-right-color:transparent}
.ledger .hero::before{content:"";position:absolute;left:22px;right:22px;top:0;height:3px;background:var(--brass);border-radius:0 0 3px 3px}
.ledger .hero .lab,.ledger .hero .note{color:#A9B7CB}
.ledger .hero .num{font-size:38px;font-weight:500;color:#fff}
.ledger .hero .pos{color:#5FDDB3}.ledger .hero .neg{color:#FF93A5}.ledger .hero .warn{color:#EBC470}
.ledger .hero .hl{color:#E4CB94}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}.mut{color:var(--muted)}
.chartbox{position:relative;height:310px}.chartbox.sm{height:255px}
/* ---- tabelas ---- */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;text-align:left;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;background:transparent}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover td{background:var(--panel2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
th.sortable{cursor:pointer}th.sortable:hover{color:var(--ink)}
.tblwrap{overflow-x:auto}
/* ---- selos ---- */
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid var(--line2);background:var(--panel2);color:var(--muted);white-space:nowrap;line-height:1.5}
.chip.D{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 35%,transparent);background:color-mix(in srgb,var(--neg) 9%,transparent)}
.chip.R{color:var(--pos);border-color:color-mix(in srgb,var(--pos) 35%,transparent);background:color-mix(in srgb,var(--pos) 9%,transparent)}
.chip.T{color:var(--inv);border-color:color-mix(in srgb,var(--inv) 35%,transparent);background:color-mix(in srgb,var(--inv) 9%,transparent)}
.chip.pend{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.chip.fut{color:var(--c3);border-color:color-mix(in srgb,var(--c3) 38%,transparent);background:color-mix(in srgb,var(--c3) 9%,transparent)}
.bar{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:12px 0 10px;background:var(--panel2);border:1px solid var(--line)}
.bar>i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px}
.legend b{font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.drop{display:block;border:1.5px dashed var(--line2);border-radius:14px;padding:30px;text-align:center;background:var(--panel2);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--panel))}
details{border-top:1px solid var(--line);padding:9px 0}details:first-of-type{border-top:0}
summary{cursor:pointer;display:flex;gap:12px;align-items:center;flex-wrap:wrap;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin:0 4px 2px 2px;flex:none}
details[open]>summary::before{transform:rotate(45deg)}
summary .nm{font-weight:600;min-width:180px}
.subs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.toast{position:fixed;right:24px;bottom:24px;background:var(--side);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;max-width:440px;z-index:50;box-shadow:0 18px 40px -14px rgba(0,0,0,.5);border-left:3px solid var(--brass)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.callout{border:1px solid color-mix(in srgb,var(--brass) 38%,var(--line));border-left:3px solid var(--brass);background:color-mix(in srgb,var(--brass) 7%,var(--panel));padding:12px 16px;border-radius:4px 12px 12px 4px;font-size:13.5px;margin:12px 0;line-height:1.55}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:13px}
.meter{position:relative;height:9px;background:var(--panel2);border-radius:99px;margin-bottom:8px;border:1px solid var(--line)}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.meter b{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:2px}
a.hl{color:var(--accent);font-size:12.5px;text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-weight:500}
.valx{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;text-decoration-line:underline;text-decoration-style:dotted;text-decoration-color:currentColor;text-underline-offset:5px;border-radius:4px;text-align:inherit}
.valx:hover{text-decoration-style:solid}
.valx:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
td .valx,th .valx{font:inherit}
/* ---- ajuda ---- */
.helpwrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.toc{position:sticky;top:20px;display:flex;flex-direction:column;gap:2px;padding:16px}
.toc b{margin-bottom:8px;font-family:var(--f-display);font-weight:500;font-size:16px}
.toc a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;font-size:13.5px;transition:background .12s,color .12s}
.toc a:hover{background:var(--panel2);color:var(--ink)}.toc a.off{opacity:.35}
.helpbody{display:grid;gap:18px}
.help h2{font-size:22px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.help h3{font-size:16.5px;margin:22px 0 6px}
.help p,.help li{max-width:80ch}.help ul,.help ol{padding-left:22px;margin:8px 0}.help li{margin:5px 0}
.help table{margin:12px 0}.help td,.help th{vertical-align:top}
.help details{border-top:1px solid var(--line);padding:11px 0}.help details p{margin:8px 0 0 19px}

/* ---- nuvem: login e indicador ---- */
.loginwrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);z-index:100;overflow:auto}
.loginwrap[hidden]{display:none}
.loginbox{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 24px 60px -30px rgba(0,0,0,.35)}
.loginbox label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:12px}
.loginbox input{display:block;width:100%;margin-top:5px;background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:10px 12px;font-size:15px}
.loginbox input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}
.lb-brand{display:flex;align-items:center;gap:10px;font-size:18px;margin-bottom:16px}
.lb-msg{min-height:20px;margin-top:10px;font-size:13.5px;color:var(--neg)}
.syncpill{position:fixed;left:14px;bottom:14px;z-index:60;border:1px solid var(--line2);background:var(--panel);color:var(--muted);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 8px 24px -14px rgba(0,0,0,.4)}
.syncpill[hidden]{display:none}
.syncpill.ok{color:var(--pos)}.syncpill.sync{color:var(--warn)}.syncpill.err{color:var(--neg);border-color:var(--neg)}
@media(min-width:821px){.syncpill{left:264px}}
@media print{.syncpill,.loginwrap{display:none!important}}
/* ---- responsivo ---- */
@media(max-width:1100px){.ledger{grid-template-columns:1fr 1fr}.ledger>div{border-bottom:1px solid var(--line)}.g2{grid-template-columns:1fr}}
@media(max-width:900px){.helpwrap{grid-template-columns:1fr}.toc{position:static}}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;padding:14px 12px}.brand{padding-bottom:12px}nav{flex-direction:row;overflow-x:auto}nav button{white-space:nowrap}nav .sep,.side-foot{display:none}main{padding:18px 16px 50px}.g2e{grid-template-columns:1fr}.ledger{grid-template-columns:1fr}.ledger .hero .num{font-size:32px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
::-webkit-scrollbar{height:9px;width:9px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><svg width="32" height="32" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="8" fill="#0B6B58"/><rect x="7" y="16" width="4" height="8" rx="1.5" fill="#fff" opacity=".55"/><rect x="13" y="11" width="4" height="13" rx="1.5" fill="#fff" opacity=".8"/><rect x="19" y="6" width="4" height="18" rx="1.5" fill="#D9BC82"/></svg><div><b>Painel financeiro</b><small>análise do app Minhas Finanças</small></div></div>
    <nav id="nav" aria-label="Seções"></nav>
    <div class="side-foot">Versão 3 · nuvem<br><button class="btn sm" id="tema">Alternar tema</button></div>
  </aside>
  <main id="view"></main>
</div>
<div id="login" class="loginwrap" hidden></div>
<button id="syncpill" class="syncpill" hidden type="button" aria-live="polite"></button>
<noscript>Este painel precisa de JavaScript.</noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<script>/* ===== NÚCLEO: leitura de CSV, normalização, deduplicação, cadastros ===== */
const Core = (() => {
  const CP1252 = {0x20AC:0x80,0x201A:0x82,0x0192:0x83,0x201E:0x84,0x2026:0x85,0x2020:0x86,0x2021:0x87,0x02C6:0x88,0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,0x017D:0x8E,0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,0x2014:0x97,0x02DC:0x98,0x2122:0x99,0x0161:0x9A,0x203A:0x9B,0x0153:0x9C,0x017E:0x9E,0x0178:0x9F};

  // Corrige arquivos "duplamente codificados" (UTF-8 lido como Windows-1252), ex.: "DescriÃ§Ã£o"
  function fixMojibake(text) {
    if (!/Ã[\u0080-\u00BF\u0152\u0153\u0160\u0161\u0178\u017D\u017E\u0192\u02C6\u02DC\u2013-\u203A\u20AC\u2122]|ï»¿/.test(text)) return text;
    const bytes = new Uint8Array(text.length);
    for (let i = 0; i < text.length; i++) {
      const c = text.charCodeAt(i);
      if (c < 256) bytes[i] = c;
      else if (CP1252[c] !== undefined) bytes[i] = CP1252[c];
      else return text;
    }
    try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes); } catch (e) { return text; }
  }

  function parseCSV(text) {
    text = text.replace(/^\uFEFF/, '');
    const first = text.split(/\r?\n/, 1)[0] || '';
    const sep = (first.split(';').length > first.split(',').length) ? ';' : ',';
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === sep) { row.push(cur); cur = ''; }
      else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
      else if (ch === '\r') { /* ignora */ }
      else cur += ch;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(r => r.some(c => c.trim() !== ''));
  }

  const normH = h => h.replace(/[\uFEFF"]/g, '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');

  function detectLayout(headers) {
    const h = headers.map(normH);
    if (h.includes('cartao')) return 'D';

}

function extremos() { let mn = '9999-99', mx = '0000-00'; for (const t of txAtivas()) { const m = mesReg(t); if (m < mn) mn = m; if (m > mx) mx = m; } const ini = state.db.config.dataInicio.slice(0, 7); if (mn < ini) mn = ini; return { mn, mx }; }

function saldos(L) {
  const lim = fimMesFechado(), r = {};

  for (const t of state.db.transacoes) {

    if (!ok) continue;

    else if (t.t === 'D' && r[t.conta]) { r[t.conta].sai += t.valor; r[t.conta].n++; }
    else if (t.t === 'T') { if (r[t.orig]) { r[t.orig].sai += t.valor; r[t.orig].n++; } if (r[t.dest]) { r[t.dest].ent += t.valor; r[t.dest].n++; } }

}

function normalizarBanco(o) {
  const b = Core.novoBanco(); Object.assign(b, o); const cp = Core.configPadrao(), oc = o.config || {}; b.config = { ...cp, ...oc, perfil: { ...cp.perfil, ...(oc.perfil || {}) }, estabManual: { ...(oc.estabManual || {}) }, pontuais: { ...cp.pontuais, ...(oc.pontuais || {}), marcar: { ...((oc.pontuais || {}).marcar || {}) } }, cdi: { ...cp.cdi, ...(oc.cdi || {}) }, metas: { ...cp.metas, ...(oc.metas || {}) }, invInicial: { ...(oc.invInicial || {}) } };
  b.importacoes = o.importacoes || []; (o.categorias?.receita || []).forEach(c => { if (c.extra === undefined) c.extra = Core.REC_EXTRA.includes(c.nome); }); b.categorias = o.categorias || { despesa: [], receita: [] }; b.cartoes = o.cartoes || []; b.contas = o.contas || []; return b;
}

state.ui.cmp = 'ant'; state.ui.dcat = '';
const baseNome = t => (t.obs.match(/#([^\s#]+)/)?.[1] || t.desc).replace(/\s*\(\d+\)\s*$/, '').replace(/\s+\d+\/\d+\s*$/, '').trim();
const cmpRange = p => { const n = p.meses.length, ini = state.db.config.dataInicio.slice(0, 7); const r = state.ui.cmp === 'ano' ? { de: addMonths(p.de, -12), ate: addMonths(p.ate, -12) } : { de: addMonths(p.de, -n), ate: addMonths(p.de, -1) }; if (r.de < ini) r.de = ini; return r; };
/* ---------------- COMPRAS PONTUAIS GRANDES ----------------
   Objetivo: tirar das comparações mensais o que é único e concentrado (carro, obra), sem confundir com parcelamentos comuns.
   Uma "compra" reúne linhas com o mesmo nome e a mesma data de lançamento (entrada + parcelas ficam juntas).
   Transferências para contas transitórias (Israel, Mãe, Outros) nunca entram: não são gasto.
   Ela é "pontual grande" se cumprir TODOS os critérios:
     1. CONCENTRAÇÃO: o maior valor que pesa em um único mês (entrada + parcelas do mesmo mês) >= max(piso, % da renda mensal base).
        Por isso um celular em 10x (parcela pequena) não conta, mas uma entrada de R$ 20 mil conta.
     2. SEM HÁBITO: o mesmo nome aparece em no máximo `maxMeses` outros meses (contas fixas nunca contam).
     3. DESTOA DA CATEGORIA (só despesas): o impacto do mês >= `multCat` x a média mensal da categoria (sem a própria compra).
   O usuário pode forçar marcar/desmarcar qualquer compra; a marcação manual vale mais que os critérios. */
let _pontCache = { k: '', v: null };
function pontuais() {
  const db = state.db, cfg = db.config, pc = cfg.pontuais;
  const k = [db.transacoes.length, JSON.stringify(pc), cfg.dataInicio, fimMesFechado(), db.contas.map(c => c.ativa === false ? c.nome : '').join(',')].join('|');
  if (_pontCache.k === k) return _pontCache.v;
  const L = lookups(), ult = fimMesFechado(), ini = cfg.dataInicio.slice(0, 7);
  let de12 = addMonths(ult, -11); if (de12 < ini) de12 = ini;
  const rb = resumo(txNoPeriodo(de12, ult, true), L).liq / Math.max(1, monthsRange(de12, ult).length);

/* ---- Agrupamento de estabelecimentos ("Onde exatamente") ----
   ATENÇÃO (aprendizado): o HORÁRIO do lançamento NÃO identifica uma compra nem um cupom. É só a hora em que a despesa foi digitada no app
   (várias compras de lojas diferentes são lançadas em sequência, no mesmo minuto). Por isso o horário nunca é usado para agrupar nem para
   herdar loja. Uma compra = uma loja; lojas só vêm do dado (est/lj, #etiqueta, observação ou descrição), nunca de vizinhança por horário.
   Origem do nome, em ordem de prioridade:
   0. Atribuição manual (config.estabManual) para um grupo "sem loja" do mesmo dia/conta/cartão/vencimento.
   1. Regras editáveis "Nome: termo1, termo2" testadas em est + lj + observações (#etiqueta) + descrição.
      Termo simples = "contém" (sem maiúsculas/acentos); "=termo" = palavra inteira (=fort acha "Fort" e "Fort Atacadista", não "Comfort").
      est/lj vieram de uma planilha pontual que ligou as compras antigas ao Estabelecimento e ao nome da loja pelo VALOR (soma dos itens = valor da linha).
      Lançamentos novos não têm est/lj: valem a #etiqueta ou a observação preenchidas no app.
   2. Sem regra: nome (loja, etiqueta ou descrição) sem números no fim, juntando variações de maiúscula/espaço.
   3. Sem nenhuma informação de loja e com 3+ linhas iguais nesse situação no mesmo dia/conta/cartão/vencimento: "Itens sem estabelecimento informado".
   "Visita" = mesma loja, mesma data de lançamento, mesma conta/cartão e vencimento (não é o horário). */
const normTxt = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
function regrasEstab() {

const SEM_LOJA = 'Itens sem estabelecimento informado';
let _estCache = { k: '', v: null };
const diaKey = t => [t.lanc, t.conta, t.cartao || '', t.venc].join('|');
function mapaEstab() {
  const cfg = state.db.config, k = state.db.transacoes.length + '|' + JSON.stringify(cfg.estabRegras || []) + '|' + JSON.stringify(cfg.estabManual || {});
  if (_estCache.k === k) return _estCache.v;
  const R = regrasEstab(), casa = txt => { const n = normTxt(txt); for (const r of R) if (r.res.some(x => x.test(n))) return r.nome; return null; };

  const limpo = s => { const bn = String(s).replace(/[\d\s]+$/, '').trim() || String(s), key = normTxt(bn).replace(/[^a-z0-9]/g, ''); return forma[key] || (forma[key] = bn); };
  const D = state.db.transacoes.filter(t => t.t === 'D'), pend = [];
  D.forEach(t => {
    const dk = diaKey(t); let nome = casa((t.est || '') + ' ' + (t.lj || '') + ' ' + (t.obs || '') + ' ' + t.desc);
    if (!nome && (t.lj || t.est)) nome = limpo(t.lj || t.est);
    if (!nome && /#\S+/.test(t.obs || '')) nome = limpo(t.obs.match(/#([^\s#]+)/)[1]);
    if (nome) ids.set(t.id, { nome, cupom: [nome, dk].join('|') }); else { pend.push(t); (semInfo.get(dk) || semInfo.set(dk, []).get(dk)).push(t); }
  });
  pend.forEach(t => { const dk = diaKey(t), g = semInfo.get(dk); const nome = man[dk] || (g.length >= 3 ? SEM_LOJA : limpo(baseNome(t))); ids.set(t.id, { nome, cupom: [nome, dk].join('|'), semLoja: nome === SEM_LOJA || !!man[dk], dk }); });

function ponteInvest(de, ate) {

  state.ui.fgts = fgtsAnt;
  let adj = 0, inInv = 0, outInv = 0, inF = 0, outF = 0, inT = 0, outT = 0;
  real.forEach(t => {
    if (t.t === 'R' && ehAjuste(t) && liq(t.conta)) adj += t.valor; else if (t.t === 'D' && ehAjuste(t) && liq(t.conta)) adj -= t.valor;
    if (t.t !== 'T') return; const oL = liq(t.orig), dL = liq(t.dest);

}

{ id: 'comece', t: 'Como o painel funciona', h: `
<p>O painel lê os relatórios que o app <b>Minhas Finanças</b> exporta em CSV (Despesas, Receitas e Transferências), guarda tudo na nuvem (Supabase) e recalcula os números sempre que você muda o período, o regime de datas ou os cadastros.</p>

<p>Pontos importantes:</p>

{ id: 'datas', t: 'Datas, regimes e parcelamentos', h: `
<p>Cada lançamento tem três datas. O seletor no topo das telas escolhe qual delas define o <b>mês</b> em que o valor aparece.</p>

<h3>Como o parcelado entra na competência</h3>
<p>Uma linha do CSV é uma <b>parcela</b>, com o valor da parcela e o próprio vencimento. Uma compra de R$ 140 em 10x feita em 21/06 gera dez linhas de R$ 14: a 1/10 conta em julho (mês do vencimento), a 2/10 em agosto, e assim por diante. A compra à vista no cartão no mesmo dia conta em junho.</p>
<h3>Contas fixas</h3>

{ id: 'sobra', t: 'Sobra, receita líquida e taxa de poupança', h: `
<div class="callout">Resposta curta: a <b>sobra não desconta investimentos</b>. Aportes são transferências e não são despesa. A sobra é o dinheiro <b>disponível para investir</b>, e “Investido no período” mostra quanto você realmente investiu.</div>
<h3>As fórmulas</h3>
<table><tbody>

<li><b>Rendimentos</b> (juros, proventos de FIIs, dividendos) são receita e <b>entram na sobra</b>.</li>

<h3>Exemplo com números fictícios</h3>

<h3>Investi mais do que a sobra. Como é possível?</h3>

<p>Aqui você investiu mais do que a sobra do mês. A diferença veio de dinheiro guardado antes. Em <b>Receitas e poupança</b>, o gráfico “Sobra acumulada e o que foi investido” compara os dois.</p>
<h3>Receitas sazonais (13º, férias, PLR)</h3>
<p>13º (duas vezes), férias (duas vezes), PLR (uma vez) e similares são receitas <b>esperadas todo ano</b>, só que em meses específicos. Por isso o painel as trata como parte da sua renda. Elas ficam marcadas como <b>sazonais</b> (você pode mudar em Cadastros) apenas para você enxergar o efeito delas:</p>
<ul><li><b>Sazonais (líquidas):</b> essas receitas menos os descontos ligados a férias, 13º e PLR.</li>
<li><b>Sem sazonais:</b> receita líquida − sazonais. É a renda “de todo mês”, sem os bônus.</li>
<li><b>Taxa “sem sazonais”:</b> mostra a poupança do mês a mês. Ela é informativa e fica negativa se o dia a dia gasta mais do que entra sem bônus.</li></ul>
<h3>Renda mensal base</h3>
<p>Faixas, metas, taxa de poupança de Despesas e Insights e o simulador usam uma <b>renda mensal base</b>, para que um mês com PLR não distorça os percentuais. Você escolhe em Insights e metas:</p>
<ul><li><b>Média dos últimos 12 meses (padrão):</b> receita líquida dos últimos 12 meses fechados ÷ 12, incluindo 13º, férias e PLR. É a leitura mais justa, porque um ano completo tem todos os bônus.</li>
<li><b>Receita líquida do próprio período:</b> só serve para períodos de 12 meses ou mais.</li>

{ id: 'receitas', t: 'Receitas: grupos, FGTS, sazonais e ajustes', h: `

{ id: 'despesas', t: 'Despesas: categorias, faixas e comparações', h: `
<h3>O que conta como despesa</h3>
<p>Tudo que é do tipo Despesa, menos deduções da folha, custos de investimento e ajustes. Transferências para Israel, Mãe e Outros não são despesa (veja “Contas transitórias”).</p>
<h3>Grupos: necessidades e desejos</h3>
<p>Cada categoria pertence a um grupo editável em Cadastros. <b>Necessidades:</b> mercado, moradia, carro, saúde, educação, transporte, animais, serviços. <b>Desejos:</b> alimentação fora de casa, lazer, vestuário, beleza, presentes, eletrônicos e similares.</p>
<h3>Faixas “adequadas”</h3>
<p>Cada categoria tem um intervalo de referência, em % da <b>renda mensal base</b> (média dos últimos 12 meses, incluindo 13º, férias e PLR; veja “Sobra, receita líquida e taxa de poupança”). Elas são pontos de partida, não regras. Ajuste em Cadastros conforme sua vida. No seu caso, Moradia tem faixa baixa (0–8%) porque a casa é paga por sua mãe e seu namorado, e Mercado tem faixa alta (15–25%) porque você compra para três pessoas.</p>
<table><tbody><tr><td><span class="chip D">Acima da faixa</span></td><td>O gasto passou do teto. O “excesso por mês” mostra quanto reduzir para voltar ao teto.</td></tr>
<tr><td><span class="chip R">Dentro</span></td><td>Entre o mínimo e o máximo.</td></tr>
<tr><td><span class="chip">Abaixo da faixa</span></td><td>Menos que o mínimo. Não é um problema por si só.</td></tr>
<tr><td><span class="chip">Sem faixa</span></td><td>Categoria sem referência de faixa.</td></tr></tbody></table>
<h3>Necessidades, desejos e poupança</h3>
<p>Parte da regra 50/30/20 (necessidades, desejos, poupança), adaptada ao seu perfil: <b>necessidades até 40%, desejos até 30%, poupança 30% ou mais</b>, editáveis em Insights e metas. A regra clássica supõe pagar moradia; como isso não acontece com você, a poupança possível é maior. Os percentuais usam a renda mensal base. A poupança mostrada é 1 − necessidades − desejos, ou seja, a taxa de poupança recorrente.</p>
<h3>Comparação entre períodos (▲▼)</h3>
<p>O <b>período anterior</b> é a janela de mesma duração logo antes do período escolhido. Exemplo: em set/25 a ago/26 (12 meses), o anterior seria set/24 a ago/25. Como os dados começam em 01/01/2025, ele é cortado e só usa jan/25 a ago/25 (8 meses). Nesse caso os valores dele são <b>multiplicados por 12 ÷ 8 = 1,5</b> para equivaler a 12 meses. Uma frase no topo da Visão geral diz exatamente qual janela foi usada e se houve esse ajuste, e o asterisco (*) marca as variações ajustadas. Passe o mouse sobre ▲▼ para ver o valor anterior e a diferença em R$.</p>
<p>Variação = (atual − anterior) ÷ |anterior|. Em Despesas você também pode comparar com o <b>mesmo período do ano anterior</b>.</p>
<p><b>Cuidados:</b> se o valor anterior é negativo ou muito pequeno, a variação percentual fica enorme e pouco informativa. Meses atípicos no período anterior (como o carro de fev/2025) também distorcem. Use o filtro de compras pontuais para reduzir isso.</p>
<h3>“O que cortar ou vigiar”</h3>
<ul><li><b>Acima do teto:</b> categorias acima da faixa, com o excesso mensal.</li><li><b>Cresceram mais de 30%:</b> variação em relação à comparação, para categorias com pelo menos R$ 60 por mês.</li><li><b>Maiores compras avulsas (≥ R$ 800):</b> explicam picos, não hábito. As que atendem aos critérios da seção “Compras pontuais grandes” podem ser tiradas das análises pelo filtro do topo.</li></ul>
<h3>“Onde exatamente”: estabelecimentos agrupados</h3>
<p>Ao clicar numa categoria, a tabela mostra onde o dinheiro foi, com nomes parecidos juntos. Regras editáveis em “Regras de agrupamento”, uma por linha, no formato <b>Nome: termo1, termo2</b>:</p>
<ul><li>Um termo simples agrupa tudo que <b>contém</b> aquele texto, sem diferenciar maiúsculas nem acentos.</li>
<li>Com <b>=</b> na frente, só a palavra inteira: “=fort” acha “Fort” e “Fort Atacadista”, mas não “Comfort” nem “Forte”. A razão social “SDB Comércio de Alimentos” também entra em Fort.</li>
<li>A busca olha o estabelecimento identificado, a #etiqueta, as observações e a descrição. A primeira regra que combinar vale.</li>
<li><b>O horário não conta.</b> O horário do lançamento é só a hora em que você digitou a despesa no app; várias compras de lojas diferentes são lançadas em sequência, no mesmo minuto. Por isso o painel nunca agrupa nem herda loja pelo horário. Uma compra tem uma loja só, e a loja vem do dado (etiqueta, observação, descrição ou a planilha antiga).</li>
<li><b>Lançamentos antigos:</b> muitos vinham sem o nome da loja. Uma planilha enviada uma única vez foi usada para identificar a loja de cada compra, ligando pela data, conta, cartão, vencimento e pelo <b>valor</b> (a soma dos itens tem que ser igual ao valor da linha da planilha). Isso ficou guardado nos lançamentos e vai no backup em JSON. Essa planilha <b>não</b> é um formato de importação.</li>
<li><b>Lançamentos novos:</b> a loja vem da #etiqueta ou das observações que você preencher no app.</li>
<li><b>Visita:</b> mesma loja, mesma data, mesma conta/cartão e mesmo vencimento.</li>
<li>Lançamentos sem nenhuma informação de loja, com 3 ou mais linhas no mesmo dia, conta e cartão, aparecem como “Itens sem estabelecimento informado”. Você pode escolher a loja desse grupo, mas todos os itens dele vão para ela; se houve mais de uma loja no dia, use a etiqueta.</li>
<li>Um aviso “Possível categoria errada” lista lançamentos em Mercado cujo nome lembra restaurante, farmácia, pet ou loja de utilidades.</li></ul>
<h3>Despesas fixas e assinaturas ativas</h3>
<p>Lançamentos recorrentes (“fixa mensal”) que tiveram vencimento nos últimos três meses fechados. O valor mostrado é o mais recente.</p>
<h3>Cartão e forma de pagamento</h3>
<p>Quatro formas: <b>cartão à vista, cartão parcelado, sem cartão</b> (Pix, débito, dinheiro) e <b>parcelado sem cartão</b>. “% parcelado” compara as parcelas com o total gasto. O uso do limite = média mensal ÷ limite, se você informar o limite em Cadastros.</p>
<h3>Parcelamentos em andamento</h3>
<p>Agrupa as parcelas que vencem <b>depois do último mês fechado</b>, por compra. Mostra valor da parcela, quantas faltam, quanto resta pagar e o mês da última. O “próximos 3 meses” é a média mensal dessas parcelas, comparada à renda mensal base. Como setembro não foi importado, esse total está incompleto.</p>
<h3>Contas transitórias (Israel, Mãe e Outros)</h3>
<p>Essas três contas não são receita nem despesa. Elas existem só porque as transferências para elas e delas movimentam o saldo das suas contas. Funcionam como um “acerto de contas”:</p>
<ul><li>Tudo que você envia é <b>valor a receber</b>. Tudo que a pessoa envia de volta abate esse valor.</li>
<li>O <b>saldo da conta</b> mostra a situação: positivo = ela te deve (a receber); negativo = você deve a ela (a pagar). Ele aparece na Visão geral e em Despesas → Contas transitórias.</li>
<li>Nada disso entra em despesas, receitas, sobra, comparações ou compras pontuais. Um serviço que você pagou e vai ser reembolsado (como a fossa) entra assim, automaticamente.</li>
<li>Se algo que você paga <b>para</b> uma dessas pessoas for um gasto seu de verdade (que ela não vai devolver), o correto é lançar como despesa no app, não como transferência.</li>
<li>Esses saldos só mudam a “Sobra do período” de forma indireta: pela conciliação da aba Receitas e poupança, quando entram como fonte ou uso de dinheiro.</li></ul>` },

{ id: 'pontuais', t: 'Compras pontuais grandes', h: `
<p>Algumas compras únicas e enormes (como o carro em fev/2025, com a entrada e as 5 parcelas) distorcem as médias e as comparações. O filtro <b>“excluir compras pontuais grandes”</b>, no topo das telas, tira essas compras das análises do período. A lista e os critérios ficam em <b>Despesas → Compras pontuais grandes</b>.</p>
<h3>O que é uma “compra”</h3>
<ul><li><b>Despesa:</b> todas as linhas com o mesmo nome e a mesma data de lançamento. A entrada e as parcelas de um mesmo carro ficam na mesma compra.</li>
</ul>
<h3>Os três critérios (todos precisam valer)</h3>
<ol><li><b>Concentração:</b> o maior valor que a compra pesa em <b>um único mês</b> (entrada mais parcelas daquele mês) deve ser de pelo menos 50% da renda mensal base, com piso de R$ 2.000. Com a base atual, o limiar é de cerca de R$ 4.400. Um celular de R$ 4.600 em 10x <b>não</b> conta, porque pesa R$ 460 por mês; a entrada de R$ 20 mil conta. Ou seja, o parcelamento em si não torna a compra pontual, o que importa é quanto ela concentra num mês.</li>
<li><b>Sem hábito:</b> não é conta fixa e o mesmo nome aparece em, no máximo, 2 outros meses. Uma compra grande no mesmo mercado ou posto de sempre não conta.</li>
<li><b>Destoa da categoria</b> (só despesas): o impacto do mês é pelo menos 3 vezes a média mensal da categoria, sem contar a própria compra.</li></ol>
<p>Os números (50%, R$ 2.000, 3×, 2 meses) são editáveis no painel. Você também pode marcar ou desmarcar qualquer compra manualmente, e a sua marcação vale mais que os critérios.</p>
<h3>O que acontece ao marcar</h3>
<ul><li>Todas as linhas da compra, <b>inclusive as parcelas futuras</b>, saem das análises do período (totais, categorias, comparações, insights).</li>

<li>As parcelas ainda não pagas continuam em “Parcelamentos em andamento”, porque são compromissos reais.</li>
<li>Saldos, aportes, conciliação e a aba Lançamentos <b>não</b> mudam, pois o dinheiro realmente saiu.</li></ul>` },

{ id: 'saldos', t: 'Saldos das contas e calibração', h: `
<h3>Como o saldo é calculado</h3>
<p><b>Saldo estimado = saldo inicial + entradas − saídas</b>, considerando só o que foi realmente movimentado:</p>
<ul><li><b>Receitas e despesas:</b> apenas as que têm data de efetivação, entre 01/01/2025 e o último mês fechado.</li>
<li><b>Transferências:</b> pela data de vencimento, no mesmo intervalo. O destino recebe e a origem perde.</li>
<li><b>Ajustes de saldo</b> entram, porque alteram o saldo do banco.</li></ul>
<h3>Saldo inicial e saldo real</h3>
<p>O relatório não traz saldo, então ele é calibrado. Em Cadastros há dois campos: o <b>saldo em 31/12/2024</b> e o <b>saldo real</b> em 31/08/2026. Digitar um recalcula o outro, sempre pela regra saldo real = saldo inicial + movimento. Se algum lançamento estiver faltando, o saldo inicial calculado fica estranho (por exemplo, negativo).</p>
<div class="callout">Hoje o relatório de Transferências só começa em 30/06/2025. Sem as transferências de jan a jun/2025, os saldos iniciais de Santander e Inter ficam distorcidos. Os saldos atuais continuam corretos porque foram informados por você.</div>
<h3>Por que um saldo pode não bater com o banco</h3>
<ul><li>Lançamentos <b>pendentes</b> (sem efetivação) não entram.</li><li>Faltam transferências ou receitas.</li><li>O mês seguinte ao último fechado não foi importado.</li></ul>
<p>Contas <b>inativas</b> saem das tabelas e dos gráficos, mas suas transferências com contas ativas continuam contando no saldo das ativas.</p>` },

{ id: 'invest', t: 'Investimentos: patrimônio, rentabilidade e CDI', h: `
<h3>Instituições</h3>
<p>Os rendimentos são agrupados por instituição (Inter, Santander, Nubank, Nomad, PicPay, FIIs e ações). Cada instituição está ligada às suas contas de investimento (por exemplo, Inter = Inter Investimentos + Global Account Inter). O tipo da conta, definido em Cadastros, decide o que é investimento.</p>
<h3>Aporte e resgate</h3>
<ul><li><b>Aporte:</b> transferência de uma conta que não é da instituição para uma conta dela.</li><li><b>Resgate:</b> o caminho inverso.</li><li><b>Rendimento:</b> receitas da categoria “Rendimentos”.</li><li><b>IR/perdas:</b> despesas de IRRF sobre aplicações, IOF e prejuízos nas contas da instituição.</li></ul>
<h3>Saldo estimado</h3>
<p>Saldo inicial (calibrado) + aportes − resgates + rendimentos − IR/perdas, mês a mês, a partir de “Rastrear desde”. O <b>patrimônio</b> soma as instituições com conta de investimento e <b>não inclui</b> FGTS nem renda variável.</p>
<h3>Calibração</h3>
<p>Como não existe o saldo de partida, você informa o <b>saldo real de cada instituição</b>. O painel calcula o saldo de partida como saldo real − tudo que aconteceu desde “Rastrear desde”. Sem isso, a rentabilidade não é calculada (aparece “—”), porque ficaria inflada.</p>
<h3>Rentabilidade do mês</h3>
<p>Rentabilidade = (rendimentos − IR/perdas) ÷ base, sendo a base o saldo do início do mês + metade do movimento líquido do mês (aportes − resgates), que supõe que o dinheiro entrou no meio do mês. A rentabilidade do período é o encadeamento dos meses (juros compostos). Meses com base abaixo de R$ 50 são ignorados.</p>
<h3>Comparação com o CDI</h3>
<ul><li>O CDI mensal vem do CDI anual de cada ano (editável em Parâmetros de comparação).</li>
<li>Os rendimentos que os apps mostram costumam vir <b>depois do IR</b>. Por isso o CDI é reduzido pela alíquota que você definir em “IR na comparação” (padrão 15%). Use 0 para comparar com o CDI bruto.</li>
<li><b>% do CDI</b> = rentabilidade da carteira ÷ CDI líquido no mesmo período.</li>
<li><b>Esperado</b> = base de cada mês × CDI líquido do mês × “% do CDI esperado” (padrão 100%).</li>
<li><b>Diferença</b> = rendimento real líquido − esperado.</li></ul>
<p>Situações: <span class="chip R">Dentro do esperado</span> quando a carteira rendeu pelo menos 98% do esperado; <span class="chip D">Abaixo do CDI</span> caso contrário; <span class="chip pend">Calibrar</span> quando falta o saldo real; <span class="chip">Em dólar</span> para Nomad (a variação cambial não se compara ao CDI); <span class="chip">Sem saldo</span> para instituições zeradas.</p>
<h3>Renda variável</h3>
<p>O relatório só traz os pagamentos (proventos, dividendos, JCP). Você vê o total por mês e por papel, sem posição nem valorização de cotas.</p>
<h3>FGTS</h3>
<p>Mostra depósitos, rendimento, saques e saldo estimado no período. O rendimento anualizado é o rendimento dividido pelo saldo médio. A referência do FGTS é 3% ao ano mais TR, mais a distribuição de lucros. Fica fora do patrimônio investido por ter baixa liquidez.</p>` },

{ id: 'insights', t: 'Insights, metas, reserva e projeção', h: `
<p>Os pareceres são regras automáticas sobre o período selecionado. Cada um vem com um nível:</p>
<table><tbody><tr><td><span class="chip D">Alerta</span></td><td>Precisa de ação.</td></tr><tr><td><span class="chip pend">Atenção</span></td><td>Vale acompanhar.</td></tr><tr><td><span class="chip fut">Informação</span></td><td>Contexto útil.</td></tr><tr><td><span class="chip R">Tudo certo</span></td><td>Dentro do esperado.</td></tr></tbody></table>
<h3>Regras usadas</h3>
<table><thead><tr><th>Parecer</th><th>Como é decidido</th></tr></thead><tbody>
<tr><td>Taxa de poupança sobre a renda base</td><td>Verde se atinge a meta, atenção se está acima de 60% da meta, alerta abaixo disso.</td></tr>
<tr><td>Caminho até a meta</td><td>Para cada degrau (0%, 10%, 20% e a meta), o quanto cortar por mês: (degrau − taxa atual sobre a renda base) × renda mensal base.</td></tr>
<tr><td>Necessidades</td><td>Verde até o limite, atenção até 10 pontos acima, alerta acima disso.</td></tr>
<tr><td>Categorias acima da faixa</td><td>Lista as três maiores por excesso mensal.</td></tr>
<tr><td>Cresceram mais de 30%</td><td>Compara com o período de comparação, ajustado à mesma duração.</td></tr>
<tr><td>Parcelado</td><td>Atenção se as parcelas passam de 30% do gasto.</td></tr>
<tr><td>Parcelas comprometidas</td><td>Média dos próximos três meses; atenção se passar de 15% da renda mensal base.</td></tr>
<tr><td>Carteira contra o CDI</td><td>Verde se o rendimento real é maior ou igual ao esperado.</td></tr>
<tr><td>Reserva de emergência</td><td>Patrimônio investido ÷ despesa média mensal. Verde se atinge sua meta de meses, atenção a partir de 3 meses, alerta abaixo.</td></tr>
<tr><td>Sobra sem destino</td><td>Aparece se sobra − aportes líquidos passa de 5% da renda base do período.</td></tr>
<tr><td>Mercado por pessoa</td><td>Média mensal do mercado ÷ pessoas informadas no Perfil da casa.</td></tr>
<tr><td>Compras acima de R$ 2.000</td><td>Aviso de que distorcem a média.</td></tr>
<tr><td>Pendentes / categoria “Outros”</td><td>Avisos de qualidade dos dados.</td></tr></tbody></table>
<h3>Metas</h3>
<p>Tudo editável: taxa de poupança, limites de necessidades e desejos, meta de mercado, aporte mensal, patrimônio alvo, meses de reserva e horizonte.</p>
<h3>Simulador de corte</h3>
<p>Aplica um percentual sobre o total de <b>desejos</b> e outro sobre o <b>mercado</b> do período. A economia mensal = (desejos × % + mercado × %) ÷ meses. A nova taxa = (renda base − despesa mensal + economia) ÷ renda base.</p>
<h3>Projeção do patrimônio</h3>
<p>Parte do patrimônio investido atual e soma o aporte mensal (o que você definiu, ou a média líquida do período). O retorno é o CDI do último ano cadastrado × “% do CDI”, reduzido em 15% de IR. A linha verde inclui a economia do simulador. É uma estimativa, não uma garantia.</p>` },

{ id: 'importacao', t: 'Importar, exportar e manter os dados', h: `
<h3>Importar CSV</h3>
<p>Arraste os CSVs de Despesas, Receitas e Transferências. O tipo é detectado pelas colunas, e arquivos com acentos corrompidos são corrigidos. Uma prévia mostra o que vai acontecer <b>antes</b> de você confirmar:</p>
<ul><li><b>Novas:</b> entram.</li><li><b>Atualizam:</b> já existiam, mas mudou a data de efetivação, categoria, subcategoria ou observação. O painel atualiza esses campos.</li><li><b>Já existem:</b> iguais, são ignoradas. Não há duplicidade.</li><li><b>Ignoradas:</b> caem em um mês listado em “Meses ignorados”.</li><li><b>Antes do início:</b> anteriores ao início da análise.</li><li><b>Erros:</b> linhas com data ou valor inválidos.</li></ul>
<h3>Como evita duplicar</h3>
<p>Cada lançamento recebe uma identidade calculada com tipo, descrição, valor, data e hora do lançamento, vencimento, parcela, conta, cartão, origem e destino. Efetivação, categoria e observações ficam de fora, para que uma mudança neles atualize a linha em vez de duplicar. Linhas realmente idênticas no mesmo arquivo são contadas separadamente.</p>
<h3>Meses ignorados</h3>
<p>Impedem que um mês incompleto seja importado agora e duplicado depois. Um lançamento é ignorado se o mês de lançamento ou o mês de competência estiver na lista. Quando o relatório completo de setembro chegar, esvazie o campo e ajuste o “Último mês fechado”.</p>
<h3>Rotina mensal sugerida</h3>
<ol><li>No app, exporte os três CSVs.</li><li>Importe aqui e confira a prévia.</li><li>Ajuste “Último mês fechado” e os meses ignorados.</li><li>Confira pendências em Lançamentos.</li><li>Exporte o JSON como backup.</li></ol>
<h3>JSON e onde os dados ficam</h3>
<p>O painel guarda tudo no armazenamento do navegador. O JSON exportado é seu backup completo (transações, contas, categorias, saldos, metas e histórico). Ao importar um JSON, “mesclar” não duplica e “substituir tudo” troca os dados. Abrir o HTML em outro navegador ou pasta pode começar do zero, então importe o JSON.</p>
<h3>Contas ativas e inativas</h3>
<p>Desmarcar “Ativa” em Cadastros remove a conta dos gráficos e dashboards: receitas e despesas dela, os cartões ligados e as transferências em que ela é origem ou destino. A aba Lançamentos continua mostrando tudo.</p>` },

{ id: 'cores', t: 'Cores, símbolos e filtros do topo', h: `
<table><tbody>
<tr><td><b class="pos">Verde</b></td><td>Positivo ou dentro do esperado.</td></tr>
<tr><td><b class="neg">Vermelho</b></td><td>Negativo, acima do limite ou abaixo do esperado.</td></tr>
<tr><td><b class="warn">Âmbar</b></td><td>Atenção, sazonal ou pendente.</td></tr>
<tr><td><b style="color:var(--inv)">Roxo</b></td><td>Investimentos.</td></tr>
<tr><td>▲ / ▼</td><td>Variação contra o período anterior. Para despesas, ▼ é bom. Para receitas e sobra, ▲ é bom.</td></tr>
<tr><td>*</td><td>A comparação usou menos meses e foi ajustada.</td></tr>
<tr><td>▲ ▼ no gráfico da taxa de poupança</td><td>Mês fora do eixo de −100% a +100%: o ponto fica no limite e o valor real aparece ao passar o mouse.</td></tr>
<tr><td>—</td><td>Não calculável (falta dado ou calibração).</td></tr></tbody></table>
<h3>Filtros do topo</h3>
<ul><li><b>Regime:</b> como as datas definem o mês (veja “Datas, regimes e parcelamentos”).</li><li><b>Período:</b> 6 meses, 12 meses, ano, tudo ou personalizado, sempre terminando no último mês fechado.</li><li><b>Incluir meses futuros:</b> traz parcelas e contas já lançadas para frente.</li><li><b>Incluir FGTS na receita:</b> conta depósitos e rendimento do FGTS como receita.</li></ul>
<p>O tema claro/escuro fica na base do menu lateral.</p>` },

{ id: 'limites', t: 'Limitações e cuidados', h: `
<ul>
<li>O painel só sabe o que está nos CSVs. Se um lançamento não foi registrado no app, ele não existe aqui.</li>
<li>As faixas de referência são orientações gerais, não recomendações personalizadas. O painel não substitui um profissional de finanças.</li>
<li>A rentabilidade é uma estimativa, feita com fluxos mensais. Ela depende de você informar saldos reais corretos e de os rendimentos estarem lançados.</li>
<li>Rendimentos de renda variável não incluem valorização de cotas.</li>
<li>Contas em dólar (Nomad, Global Account) usam o saldo em reais que você informou, e a variação cambial mistura ganho e efeito do câmbio.</li>
<li>O CDI por ano é um parâmetro que você pode editar. Confira em fontes oficiais.</li>
<li>Meses incompletos (setembro/2026 em diante) não devem ser interpretados como resultado final.</li>
<li>Categorias sem subcategoria limitam a análise de onde cortar.</li></ul>` },

{ id: 'faq', t: 'Perguntas frequentes: “por que esse número?”', h: `
<details open><summary><b>Como posso ter investido mais do que sobrou?</b></summary><p>Veja a seção “Sobra, receita líquida e taxa de poupança” e a tabela “De onde veio o dinheiro investido”. Em resumo: aportes podem vir de saldo guardado antes, de FGTS ou de reembolsos, e a sobra só mede o período.</p></details>
<details><summary><b>A sobra do período desconta meus investimentos?</b></summary><p>Não. Investimentos são transferências. A sobra é o que você pode investir. O quanto você investiu está em “Investido no período”. Os rendimentos entram como receita, e o IR sobre eles é uma dedução.</p></details>
<details><summary><b>Por que a sobra é positiva, mas a taxa “sem sazonais” é negativa?</b></summary><p>Porque 13º, férias e PLR cobriram o mês a mês. Eles são esperados todo ano e por isso contam na renda base, mas a taxa “sem sazonais” mostra a dependência deles.</p></details>
<details><summary><b>Por que o INSS e o IRRF não estão nas despesas?</b></summary><p>São deduções obrigatórias do salário. Elas reduzem a receita líquida, mas não são gastos seus.</p></details>
<details><summary><b>Paguei a fatura do cartão. Por que não vejo essa despesa?</b></summary><p>Porque o gasto já foi contado quando você comprou (ou na parcela). Contar o pagamento da fatura duplicaria o valor.</p></details>
<details><summary><b>Por que uma compra parcelada aparece um mês depois de uma à vista?</b></summary><p>Na competência, a parcela vale no mês do vencimento. Use o regime “Lançamento” para ver o valor total no mês da compra.</p></details>
<details><summary><b>Por que a despesa é diferente em cada regime?</b></summary><p>Os regimes distribuem os mesmos lançamentos em meses diferentes, e o recorte de 2025 tira do “Lançamento” as parcelas de compras feitas antes de 2025.</p></details>
<details><summary><b>Por que meu saldo não bate com o banco?</b></summary><p>Veja pendências, transferências faltantes e o mês não importado. Informe o saldo real em Cadastros para recalibrar.</p></details>
<details><summary><b>Por que a rentabilidade aparece como “—”?</b></summary><p>Falta informar o saldo real da instituição em Investimentos.</p></details>
<details><summary><b>Por que a carteira “rendeu menos que o CDI” se o banco diz 100% do CDI?</b></summary><p>Provavelmente porque o rendimento do app já vem sem IR. Confira o campo “IR na comparação”, que reduz o CDI para uma comparação justa.</p></details>
<details><summary><b>Por que o mercado aparece “acima da faixa” se eu compro para três?</b></summary><p>A faixa foi ajustada, mas a base é a renda mensal base (média de 12 meses). Se o valor é o que você quer gastar, aumente a faixa em Cadastros ou defina uma meta de mercado.</p></details>
<details><summary><b>Paguei algo que outra pessoa vai me devolver. Como não contar como gasto?</b></summary><p>Se o pagamento foi por transferência para Israel, Mãe ou Outros, já é tratado como valor a receber, e não como gasto. Veja “Contas transitórias”.</p></details>
<details><summary><b>Desativei uma conta e os números mudaram. Está certo?</b></summary><p>Sim. Tudo ligado a ela sai das análises. Reative em Cadastros para voltar.</p></details>
<details><summary><b>Importei o mesmo arquivo duas vezes. Duplicou?</b></summary><p>Não. Os lançamentos iguais são reconhecidos e aparecem como “Já existem”.</p></details>` },

{ id: 'glossario', t: 'Glossário', h: `
<table><tbody>
<tr><td><b>Aporte</b></td><td>Dinheiro enviado para uma conta de investimento.</td></tr>
<tr><td><b>Base (rentabilidade)</b></td><td>Saldo do início do mês + metade do movimento líquido, usado como denominador.</td></tr>
<tr><td><b>Competência</b></td><td>Mês ao qual o gasto ou a receita pertence, independente de quando foi pago.</td></tr>
<tr><td><b>CDI</b></td><td>Taxa de referência da renda fixa, próxima da Selic.</td></tr>
<tr><td><b>Dedução</b></td><td>Valor obrigatório retirado da receita (INSS, IRRF, IR sobre aplicações).</td></tr>

/* ---------- Navegação com histórico (links explicativos + Voltar) ----------
   Cada card com um valor clicável abre uma página de detalhe explicando como aquele número
   foi formado. O botão Voltar empilha/desempilha um snapshot completo da tela (aba, filtros,
   posição da rolagem), então volta exatamente para onde você estava, mesmo depois de vários
   níveis de detalhe (ex.: Despesas → categoria → subcategoria). */
const CAMPOS_CTX = ['regime', 'preset', 'de', 'ate', 'futuro', 'fgts', 'semPont', 'cmp'];
function snapCtx(extra) { const c = {}; CAMPOS_CTX.forEach(k => c[k] = state.ui[k]); return { ...c, ...extra }; }
function comContexto(ctx, fn) {
  const u = state.ui, salvos = {};
  CAMPOS_CTX.forEach(k => { salvos[k] = u[k]; if (ctx && ctx[k] !== undefined) u[k] = ctx[k]; });
  try { return fn(); } finally { Object.assign(u, salvos); }
}
function ex(id, htmlValor, extraCtx) {
  return `<button type="button" class="valx" data-ex="${id}" data-ctx='${esc(JSON.stringify(snapCtx(extraCtx)))}'>${htmlValor}</button>`;
}
// Exclui só 'pilha' do snapshot (evita nesting infinito); 'detalhe' fica dentro, para
// que Voltar a partir de um detalhe encadeado (categoria -> despesas -> sobra) restaure
// o detalhe anterior corretamente, e não apenas a aba normal.
function cloneUiSemPilha() { const { pilha, ...resto } = state.ui; return JSON.parse(JSON.stringify(resto)); }
// Contador de navegação: invalida um ajuste de rolagem agendado (rAF) se, antes dele rodar,
// o usuário já navegou de novo (ex.: clicar em Voltar várias vezes seguidas rapidamente).
let _navGen = 0;
function abrirDetalhe(id, ctx) {
  if (!state.ui.pilha) state.ui.pilha = [];
  state.ui.pilha.push({ ui: cloneUiSemPilha(), scroll: window.scrollY });
  state.ui.detalhe = { id, ctx };
  state.ui.tab = '_detalhe';
  _navGen++;
  render(); window.scrollTo(0, 0);
}
function voltar() {
  const pilha = state.ui.pilha || (state.ui.pilha = []);
  const topo = pilha.pop();
  if (!topo) { _navGen++; state.ui.tab = 'geral'; state.ui.detalhe = null; render(); window.scrollTo(0, 0); return; }
  const pAtual = state.ui.pilha;
  Object.assign(state.ui, topo.ui);
  state.ui.pilha = pAtual;
  render();
  // setTimeout em vez de requestAnimationFrame: rAF pode ficar pausado em abas/páginas
  // sem foco (ex.: testes automatizados, ou o usuário trocando de aba do navegador logo após clicar).
  const y = topo.scroll || 0, g = ++_navGen;
  setTimeout(() => { if (g === _navGen) window.scrollTo(0, y); }, 0);
  setTimeout(() => { if (g === _navGen) window.scrollTo(0, y); }, 60);
}
function viewDetalhe(v) {
  const d = state.ui.detalhe || {}, fn = EXPLICA[d.id];
  if (!fn) { v.innerHTML = `<button type="button" class="btn" id="btnVoltar">← Voltar</button><div class="panel empty" style="margin-top:14px">Não foi possível abrir este detalhamento.</div>`; $('#btnVoltar').onclick = voltar; return; }
  let out; try { out = fn(d.ctx || {}); }
  catch (e) { v.innerHTML = `<button type="button" class="btn" id="btnVoltar">← Voltar</button><div class="panel empty" style="margin-top:14px">Não foi possível calcular este detalhamento: ${esc(e.message)}</div>`; $('#btnVoltar').onclick = voltar; return; }
  v.innerHTML = `<div class="top"><div><button type="button" class="btn" id="btnVoltar">← Voltar</button><h1 style="margin-top:14px">${esc(out.titulo)}</h1>${out.sub ? `<p class="sub">${out.sub}</p>` : ''}</div></div>${out.html}`;
  $('#btnVoltar').onclick = voltar;
}

        <tr><td><b>= Média mensal</b></td><td class="r"><b>${money(A.cur.desp / A.n)}</b></td></tr>
      </tbody></table>
      <p class="sub" style="margin-top:10px">Corresponde a ${pct(A.baseTot ? A.cur.desp / A.baseTot : NaN)} da sua renda mensal base (${money(A.baseMes)}/mês, ${MODO_BASE[state.db.config.baseRenda || 'anual']}).</p></div>`
    };
  }),
  noCartao: ctx => comContexto(ctx, () => {
    const L = lookups(), p = periodo(), A = calcDesp(p.de, p.ate, L), D = A.D.filter(t => !t.virtual);
    const cartoes = state.db.cartoes.filter(c => contaAtiva(c.conta)).map(c => c.nome);
    const pagam = ['Sem cartão', ...cartoes].map(nm => { const xs = D.filter(t => (t.cartao || 'Sem cartão') === nm); return { nm, tot: sum(xs, t => t.valor), n: xs.length, parc: sum(xs.filter(t => t.rec === 'P'), t => t.valor) }; });
    const totD = sum(pagam, x => x.tot);
    return {
      titulo: 'Como o percentual no cartão foi calculado', sub: `${fmtMes(p.de)} a ${fmtMes(p.ate)}`,
      html: `<div class="panel"><h2>Fórmula</h2><p>% no cartão = 1 − (gasto sem cartão ÷ total de despesas). Do total de ${money(totD)}, ${money(pagam[0].tot)} (${pct(totD ? pagam[0].tot / totD : 0)}) não passou por cartão de crédito.</p></div>
      <div class="panel"><h2>Por forma de pagamento</h2><table><thead><tr><th>Forma</th><th class="r">Total</th><th class="r">%</th><th class="r">Lanç.</th><th class="r">Parcelado</th></tr></thead><tbody>${pagam.map(x => `<tr><td>${esc(x.nm)}</td><td class="r">${money(x.tot)}</td><td class="r">${pct(totD ? x.tot / totD : 0, 0)}</td><td class="r">${x.n}</td><td class="r">${pct(x.tot ? x.parc / x.tot : 0, 0)}</td></tr>`).join('')}</tbody></table></div>`
    };
  }),
  acimaFaixas: ctx => comContexto(ctx, () => {
    const L = lookups(), p = periodo(), A = calcDesp(p.de, p.ate, L);
    const acima = A.rows.filter(r => r.st === 'acima').sort((a, b) => b.excesso - a.excesso);
    return {
      titulo: 'Categorias acima da faixa adequada', sub: `${fmtMes(p.de)} a ${fmtMes(p.ate)} · excesso somado ${money(sum(acima, r => r.excesso))}/mês`,
      html: `<div class="panel"><h2>O que é "acima da faixa"</h2><p>Cada categoria tem uma faixa de % da renda mensal base considerada adequada (mín–máx). Quando o gasto médio mensal da categoria passa do teto, o excesso é a diferença, em R$/mês, entre o gasto e o teto.</p></div>
      <div class="panel"><h2>Categorias acima do teto</h2><table><thead><tr><th>Categoria</th><th class="r">% da renda</th><th class="r">Teto</th><th class="r">Excesso/mês</th></tr></thead><tbody>${acima.map(r => `<tr><td>${ex('categoriaDesp', esc(r.nome), { cat: r.nome })}</td><td class="r">${pct(r.pc)}</td><td class="r mut">${r.max}%</td><td class="r neg"><b>${money(r.excesso)}</b></td></tr>`).join('') || '<tr><td colspan="4" class="empty">Nenhuma categoria acima do teto.</td></tr>'}</tbody></table></div>`
    };
  }),
  semSazonais: ctx => comContexto(ctx, () => {
    const L = lookups(), p = periodo(), txs = txNoPeriodo(p.de, p.ate), cur = resumo(txs, L), n = p.meses.length;
    return {
      titulo: 'Receita líquida sem sazonais', sub: `${fmtMes(p.de)} a ${fmtMes(p.ate)}`,
      html: `<div class="panel"><h2>Fórmula</h2><table><tbody>
        <tr><td>Receita líquida</td><td class="r">${ex('receitaLiquida', money(cur.liq))}</td></tr>
        <tr><td>(−) Sazonais (13º, férias, PLR)</td><td class="r neg">${ex('sazonais', money(-cur.extra))}</td></tr>
        <tr><td><b>= Receita líquida sem sazonais</b></td><td class="r"><b>${money(cur.liqRec)}</b></td></tr>
        <tr><td>÷ ${n} meses</td><td class="r">${money(cur.liqRec / n)}/mês</td></tr>
      </tbody></table>
      <p class="sub" style="margin-top:10px">É a parte da sua receita que se repete todo mês — a referência mais realista para planejar gastos fixos.</p></div>`
    };
  }),
  sazonais: ctx => comContexto(ctx, () => {
    const L = lookups(), p = periodo(), txs = txNoPeriodo(p.de, p.ate), cur = resumo(txs, L);
    const linhas = txs.filter(t => t.t === 'R' && dedExtra(t));
    return {
      titulo: 'Receitas sazonais no período', sub: `${fmtMes(p.de)} a ${fmtMes(p.ate)} · 13º, férias, PLR e similares`,
      html: `<div class="panel"><h2>O que entra aqui</h2><p>Receitas cujo texto ou subcategoria indica 13º salário, férias ou PLR. Somam ${money(cur.extra)}, ${pct(cur.liq ? cur.extra / cur.liq : NaN, 0)} da receita líquida do período.</p></div>
      <div class="panel"><h2>Lançamentos</h2><table><thead><tr><th>Descrição</th><th>Data</th><th class="r">Valor</th></tr></thead><tbody>${linhas.sort((a, b) => b.valor - a.valor).map(t => `<tr><td>${esc(t.desc)}</td><td>${fmtData(dataReg(t))}</td><td class="r">${money(t.valor)}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">Nenhuma no período.</td></tr>'}</tbody></table></div>`
    };
  }),
  estabilidadeSalario: ctx => comContexto(ctx, () => {
    const L = lookups(), p = periodo(), n = p.meses.length, txs = txNoPeriodo(p.de, p.ate);
    const R = txs.filter(t => t.t === 'R' && !ehAjuste(t) && (state.ui.fgts || !ehFGTS(t, L)));
    const trab = p.meses.map(m => sum(R.filter(t => mesReg(t) === m && L.catR.get(t.cat)?.grupo === 'ativa' && !L.catR.get(t.cat)?.extra), t => t.valor));
    const mu = sum(trab, x => x) / n, sd = Math.sqrt(sum(trab, x => (x - mu) ** 2) / n);
    return {
      titulo: 'Estabilidade do salário', sub: `${fmtMes(p.de)} a ${fmtMes(p.ate)} · desvio padrão ÷ média`,
      html: `<div class="panel"><h2>Fórmula</h2><p>Desvio padrão dos salários mensais (renda ativa recorrente, sem sazonais) dividido pela média. Quanto menor, mais estável. Média ${money(mu)} · desvio padrão ${money(sd)} · resultado ${pct(mu ? sd / mu : NaN, 0)}.</p></div>
      <div class="panel"><h2>Mês a mês</h2><table><thead><tr><th>Mês</th><th class="r">Salário/renda ativa</th></tr></thead><tbody>${p.meses.map((m, i) => `<tr><td>${fmtMes(m)}</td><td class="r">${money(trab[i])}</td></tr>`).join('')}</tbody></table></div>`
    };
  }),
  patrimonioInvestido: () => {
    const { insts } = calcInv(), cap = insts.filter(I => I.temCap);
    return {
      titulo: 'Como o patrimônio investido foi calculado', sub: `Em ${fmtMes(fimMesFechado())}`,
      html: `<div class="panel"><h2>O que entra</h2><p>Soma o saldo estimado de cada instituição de investimento rastreada (aportes − resgates + rendimentos − IR/perdas, a partir do saldo inicial calibrado). Não inclui FGTS nem renda variável (ações/FIIs), que ficam à parte por terem lógica própria.</p></div>
      <div class="panel"><h2>Por instituição</h2><table><thead><tr><th>Instituição</th><th class="r">Saldo estimado</th></tr></thead><tbody>${cap.map(I => `<tr><td>${ex('instituicaoInvest', esc(I.nome), { inst: I.nome })}</td><td class="r">${money(I.serie.length ? I.serie[I.serie.length - 1].saldo : I.ini)}</td></tr>`).join('')}</tbody></table></div>`
    };
  },
  aportesLiquidos: ctx => comContexto(ctx, () => {
    const cfg = state.db.config, { insts, meses } = calcInv(), cons = consolidado(insts, meses), p = periodo();
    const de = p.de < cfg.invInicioMes ? cfg.invInicioMes : p.de, ate = p.ate > fimMesFechado() ? fimMesFechado() : p.ate;
    const win = cons.filter(x => x.m >= de && x.m <= ate), ap = sum(win, x => x.ap), rs = sum(win, x => x.rs);
    return {
      titulo: 'Como os aportes líquidos foram calculados', sub: `${fmtMes(de)} a ${fmtMes(ate)}`,
      html: `<div class="panel"><h2>Fórmula</h2><table><tbody><tr><td>Aportes (transferências para investimentos)</td><td class="r">${money(ap)}</td></tr><tr><td>(−) Resgates</td><td class="r neg">${money(-rs)}</td></tr><tr><td><b>= Aportes líquidos</b></td><td class="r"><b>${money(ap - rs)}</b></td></tr></tbody></table></div>`
    };
  }),
  rendimentosLiquidos: ctx => comContexto(ctx, () => {
    const cfg = state.db.config, { insts, meses } = calcInv(), cons = consolidado(insts, meses), p = periodo();
    const de = p.de < cfg.invInicioMes ? cfg.invInicioMes : p.de, ate = p.ate > fimMesFechado() ? fimMesFechado() : p.ate;
    const win = cons.filter(x => x.m >= de && x.m <= ate), rd = sum(win, x => x.rd), ct = sum(win, x => x.ct);
    return {
      titulo: 'Como os rendimentos líquidos foram calculados', sub: `${fmtMes(de)} a ${fmtMes(ate)}`,
      html: `<div class="panel"><h2>Fórmula</h2><table><tbody><tr><td>Rendimentos brutos</td><td class="r">${money(rd)}</td></tr><tr><td>(−) IR e perdas</td><td class="r neg">${money(-ct)}</td></tr><tr><td><b>= Rendimentos líquidos</b></td><td class="r pos"><b>${money(rd - ct)}</b></td></tr></tbody></table></div>`
    };
  }),
  rentabilidadePeriodo: ctx => comContexto(ctx, () => {
    const cfg = state.db.config, { insts, meses } = calcInv(), cap = insts.filter(I => I.temCap), cons = consolidado(insts, meses), p = periodo();
    const de = p.de < cfg.invInicioMes ? cfg.invInicioMes : p.de, ate = p.ate > fimMesFechado() ? fimMesFechado() : p.ate;
    const win = cons.filter(x => x.m >= de && x.m <= ate), descal = cap.filter(I => !I.calibrada), okCal = descal.length === 0;
    let acc = 1, accC = 1; win.forEach(x => { if (x.r != null) { acc *= 1 + x.r; accC *= 1 + cdiCmp(x.m); } });
    return {
      titulo: 'Como a rentabilidade do período foi calculada', sub: `${fmtMes(de)} a ${fmtMes(ate)}`,
      html: okCal ? `<div class="panel"><h2>Fórmula</h2><p>Retorno acumulado mês a mês da carteira toda: cada mês multiplica (1 + retorno do mês), sendo o retorno do mês = rendimento líquido ÷ saldo-base. Resultado do período: <b>${pct(acc - 1, 2)}</b>. No mesmo período, o CDI líquido acumulado foi <b>${pct(accC - 1, 2)}</b>.</p></div>
        <div class="panel"><h2>Mês a mês</h2><table><thead><tr><th>Mês</th><th class="r">Carteira</th><th class="r">CDI líquido</th></tr></thead><tbody>${win.map(x => `<tr><td>${fmtMes(x.m)}</td><td class="r">${x.r != null ? pct(x.r, 2) : '—'}</td><td class="r mut">${pct(cdiCmp(x.m), 2)}</td></tr>`).join('')}</tbody></table></div>`
        : `<div class="panel empty">Calibre o saldo real de todas as instituições (aba Investimentos) para calcular a rentabilidade. Faltam: ${descal.map(I => esc(I.nome)).join(', ')}.</div>`
    };
  }),
  comparadoCDI: ctx => comContexto(ctx, () => {
    const cfg = state.db.config, { insts, meses } = calcInv(), cap = insts.filter(I => I.temCap), cons = consolidado(insts, meses), p = periodo();
    const de = p.de < cfg.invInicioMes ? cfg.invInicioMes : p.de, ate = p.ate > fimMesFechado() ? fimMesFechado() : p.ate;
    const win = cons.filter(x => x.m >= de && x.m <= ate), descal = cap.filter(I => !I.calibrada), okCal = descal.length === 0;
    let acc = 1, accC = 1, esp = 0; win.forEach(x => { if (x.r != null) { acc *= 1 + x.r; accC *= 1 + cdiCmp(x.m); esp += x.base * cdiCmp(x.m) * cfg.pctCdi / 100; } });
    const real = sum(win, x => x.rd - x.ct);
    return {
      titulo: 'Como a comparação com o CDI foi calculada', sub: `${fmtMes(de)} a ${fmtMes(ate)} · meta: ${cfg.pctCdi}% do CDI líquido`,
      html: okCal ? `<div class="panel"><h2>Fórmula</h2><table><tbody>
        <tr><td>Rendimento esperado (saldo × CDI líquido × ${cfg.pctCdi}%, mês a mês)</td><td class="r">${money(esp)}</td></tr>
        <tr><td>Rendimento líquido real</td><td class="r">${ex('rendimentosLiquidos', money(real))}</td></tr>
        <tr><td><b>Diferença</b></td><td class="r ${real >= esp ? 'pos' : 'neg'}"><b>${real >= esp ? '+' : ''}${money(real - esp)}</b></td></tr>
        <tr><td><b>% do CDI atingido</b></td><td class="r"><b>${accC > 1 ? pct((acc - 1) / (accC - 1), 0) : '—'}</b></td></tr>
      </tbody></table>
      <p class="sub" style="margin-top:10px">O CDI líquido usa ${cfg.irComparacao ?? 15}% de IR sobre o CDI bruto informado em "Parâmetros de comparação".</p></div>`
        : `<div class="panel empty">Calibre o saldo real de todas as instituições para comparar com o CDI. Faltam: ${descal.map(I => esc(I.nome)).join(', ')}.</div>`
    };
  }),
  instituicaoInvest: ctx => comContexto(ctx, () => {
    const cfg = state.db.config, { insts } = calcInv(), I = insts.find(i => i.nome === ctx.inst);
    if (!I) return { titulo: ctx.inst || 'Instituição', sub: '', html: '<div class="panel empty">Instituição não encontrada.</div>' };
    const p = periodo(), de = p.de < cfg.invInicioMes ? cfg.invInicioMes : p.de, ate = p.ate > fimMesFechado() ? fimMesFechado() : p.ate;
    const w = janela(I, de, ate);
    return {
      titulo: `Investimentos: ${I.nome}`, sub: `${I.contas.join(', ') || I.nome} · ${fmtMes(de)} a ${fmtMes(ate)}`,
      html: `<div class="ledger" style="grid-template-columns:repeat(4,1fr)">
        <div class="hero"><div class="lab">Saldo estimado</div><div class="num">${money(w.saldoFim)}</div></div>
        <div><div class="lab">Aportes líquidos</div><div class="num">${money(w.ap - w.rs)}</div><div class="note">aportes ${money(w.ap)} − resgates ${money(w.rs)}</div></div>
        <div><div class="lab">Rendimentos líquidos</div><div class="num pos">${money(w.rd - w.ct)}</div><div class="note">rendimentos ${money(w.rd)} − IR/perdas ${money(w.ct)}</div></div>
        <div><div class="lab">Rentabilidade</div><div class="num">${I.calibrada && w.k ? pct(w.rent, 2) : '—'}</div><div class="note">${I.calibrada ? (Number.isFinite(w.pcdi) ? pct(w.pcdi, 0) + ' do CDI líquido' : 'sem base para comparar') : 'calibre o saldo real para calcular'}</div></div></div>
      <div class="panel"><h2>Como é calculado</h2><p>Rentabilidade do mês = (rendimentos − IR/perdas) ÷ saldo-base do mês, onde o saldo-base soma o saldo do início do mês com metade dos aportes/resgates do mês. O "esperado" usa ${cfg.pctCdi}% do CDI líquido de ${cfg.irComparacao ?? 15}% de IR.</p>
        ${I.nome === 'Nomad' ? '<p><b>Nomad é em dólar:</b> a variação inclui câmbio, então não é comparável ao CDI.</p>' : ''}
        ${!I.calibrada ? '<p class="warn"><b>Ainda não calibrada:</b> informe o saldo real na tabela de Investimentos para obter a rentabilidade correta.</p>' : ''}</div>
      <div class="panel"><h2>Mês a mês</h2><div class="tblwrap"><table><thead><tr><th>Mês</th><th class="r">Aportes</th><th class="r">Resgates</th><th class="r">Rendimentos</th><th class="r">IR/perdas</th><th class="r">Saldo fim do mês</th><th class="r">Rentab. do mês</th></tr></thead><tbody>${I.serie.filter(x => x.m >= de && x.m <= ate).map(x => `<tr><td>${fmtMes(x.m)}</td><td class="r">${money(x.ap)}</td><td class="r">${money(x.rs)}</td><td class="r">${money(x.rd)}</td><td class="r">${money(x.ct)}</td><td class="r">${money(x.saldo)}</td><td class="r">${x.r != null ? pct(x.r, 2) : '—'}</td></tr>`).join('')}</tbody></table></div></div>`
    };
  })
};
function n_meses(p) { const n = p.meses.length; return n === 1 ? '1 mês' : n + ' meses'; }

/* ---------- Inicialização ---------- */
/* Ajustes de versão que não dependem de dados externos (rodam depois de carregar da nuvem; se nada mudar, nada é enviado). */
function posCarga() {
  const db = state.db, spec = db.config.calibracaoSpec;
  if (db.config.recorteVersao !== 1) { const n = Core.podar(db); db.config.recorteVersao = 1; save(); toast(n + ' lançamentos anteriores a 2025 foram removidos.'); }
  if (db.config.receberVersao !== 2) { db.contas.forEach(c => { delete c.receber; }); delete db.config.adiantamentos; delete db.config.adiantVersao; db.config.receberVersao = 2; save(); }
  if (db.config.perfilVersao !== 1) { const cf = db.categorias.despesa; const M = cf.find(c => c.nome === 'Mercado'), H = cf.find(c => c.nome === 'Moradia'); if (M) { M.min = 15; M.max = 25; } if (H) { H.min = 0; H.max = 8; }
    Object.assign(db.config.metas, { taxaPoupanca: 30, necessidadesMax: 40, desejosMax: 30 }); db.config.perfilVersao = 1; save(); toast('Faixas ajustadas ao seu perfil (moradia paga por terceiros, mercado para 3).'); }
  if (spec && db.config.calibracaoVersao !== spec.versao) { aplicarCalibracao(db, spec); save(); toast('Saldos de ' + fmtData(spec.data) + ' aplicados como saldos iniciais.'); }
}
function telaErro(titulo, msg) {
  document.getElementById('login').hidden = true; document.querySelector('.app').style.display = '';
  $('#view').innerHTML = `<div class="panel empty"><h2>${esc(titulo)}</h2><p>${msg}</p><div class="row" style="justify-content:center;margin-top:12px"><button class="btn primary" id="tentar">Tentar de novo</button><button class="btn" id="sairErr">Sair</button></div></div>`;
  $('#tentar').onclick = () => location.reload(); $('#sairErr').onclick = sair;
}
async function abrirApp() {
  document.getElementById('login').hidden = true; document.querySelector('.app').style.display = '';
  Cloud.setStatus('load'); $('#view').innerHTML = '<div class="panel empty">Carregando seus dados da nuvem…</div>';
  try {
    const db = await Cloud.carregar();
    Cloud.readonly = false; state.db = db || normalizarBanco(Core.novoBanco());
    if (db) posCarga(); else state.ui.tab = 'dados';
    Cloud.guardarCopiaLocal(); Cloud.setStatus(Cloud.dirty ? 'sync' : 'ok');
  } catch (e) {
    let c = null; try { c = await Store.get('cache'); } catch (x) { }
    if (c && c.db && Cloud.user && c.uid === Cloud.user.id) { state.db = normalizarBanco(c.db); Cloud.readonly = true; Cloud.setStatus('off', e.message); toast('Sem conexão com a nuvem. Mostrando a cópia do último acesso (somente leitura).'); }
    else if (e && (e.code === 'PGRST205' || e.code === '42P01' || /fin_(meta|transacoes)/.test(e.message || ''))) { telaErro('Tabelas não encontradas', 'Rode o arquivo <b>supabase_setup.sql</b> no SQL Editor do Supabase e tente de novo.'); return; }
    else { telaErro('Não consegui carregar seus dados', esc((e && e.message) || String(e))); return; }
  }
  render();
}
async function init() {
  const th = localStorage.getItem('mf_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = th;
  $('#tema').onclick = () => { const n = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = n; localStorage.setItem('mf_theme', n); render(); };
  $('#syncpill').onclick = async () => {
    if (Cloud.status === 'err') { Cloud.enviar(); return; }
    const r = await Cloud.atualizar(true); toast(r ? 'Dados atualizados da nuvem.' : (Cloud.dirty || Cloud.syncing ? 'Há alterações sendo enviadas.' : 'Você já está com a versão mais recente.'));
  };
  const cfg = sbCfg();
  if (!window.supabase) {   // biblioteca não carregou (sem internet): tenta a cópia local, só leitura
    let c = null; try { c = await Store.get('cache'); } catch (x) { }
    if (c && c.db) { Cloud.user = { id: c.uid, email: '' }; state.db = normalizarBanco(c.db); Cloud.readonly = true; Cloud.setStatus('off'); toast('Sem internet. Mostrando a cópia do último acesso (somente leitura).'); render(); return; }
    telaErro('Sem conexão', 'Não foi possível carregar as bibliotecas da internet. Conecte-se e recarregue a página.'); return;
  }
  if (!cfg.url || !cfg.key) { mostrarLogin('config'); return; }
  Cloud.conectar(cfg);
  let sess = null; try { sess = (await Cloud.sb.auth.getSession()).data.session; } catch (e) { }
  if (!sess) {
    let c = null; if (!navigator.onLine) { try { c = await Store.get('cache'); } catch (x) { } }
    if (c && c.db) { Cloud.user = { id: c.uid, email: '' }; state.db = normalizarBanco(c.db); Cloud.readonly = true; Cloud.setStatus('off'); render(); return; }
    mostrarLogin(); return;
  }
  Cloud.user = sess.user; await abrirApp();
}
init();
</script>
