<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Ccircle cx='17' cy='17' r='15.5' fill='none' stroke='%230D6B57' stroke-width='2'/%3E%3Cpath d='M17 4 L20 17 L17 30 L14 17 Z' fill='%230D6B57'/%3E%3Cpath d='M17 17 L20 17 L17 30 Z' fill='%23A86A12'/%3E%3C/svg%3E">
<title>Atlas · Planejamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: trilho de navegação fixo à esquerda (desktop) / barra inferior (celular);
   conteúdo em coluna de até 1180px. Motivo: cartografia — rotas, marcos, curvas de nível. */
:root {
  --bg: #EEF2F0;
  --surface: #FFFFFF;
  --surface-2: #F6F8F7;
  --ink: #13201C;
  --muted: #5B6A64;
  --faint: #8C9A94;
  --line: #D9E1DD;
  --line-strong: #C4CFCA;
  --accent: #0D6B57;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEDE7;
  --gold: #A86A12;
  --gold-soft: #F5E9D4;
  --slate: #687C95;
  --c4: #7D5BA6; --c5: #2F7FA8; --c6: #6E8B3D;
  --ok: #1E7F52;   --ok-soft: #DFF1E7;
  --warn: #A9690A; --warn-soft: #F8ECD5;
  --bad: #B83A33;  --bad-soft: #F7E0DE;
  --shadow: 0 1px 2px rgba(19,32,28,.06), 0 8px 24px -12px rgba(19,32,28,.18);
  --font-display: "Bricolage Grotesque", "Hanken Grotesk", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  --r-sm: 9px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0C1311; --surface: #131C19; --surface-2: #18231F; --ink: #E4ECE8; --muted: #9AA9A3; --faint: #6E7D77;
  --line: #24312C; --line-strong: #33433D; --accent: #45BF9B; --accent-ink: #06241C; --accent-soft: #163A30;
  --gold: #E0A64A; --gold-soft: #3A2C14; --slate: #93A6BE; --c4: #B497D6; --c5: #6DB3D9; --c6: #A9C46F;
  --ok: #4CC48A; --ok-soft: #12321F; --warn: #E3A23C; --warn-soft: #362812; --bad: #EF7B72; --bad-soft: #3A1714;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0C1311; --surface: #131C19; --surface-2: #18231F; --ink: #E4ECE8; --muted: #9AA9A3; --faint: #6E7D77;
  --line: #24312C; --line-strong: #33433D; --accent: #45BF9B; --accent-ink: #06241C; --accent-soft: #163A30;
  --gold: #E0A64A; --gold-soft: #3A2C14; --slate: #93A6BE; --c4: #B497D6; --c5: #6DB3D9; --c6: #A9C46F;
  --ok: #4CC48A; --ok-soft: #12321F; --warn: #E3A23C; --warn-soft: #362812; --bad: #EF7B72; --bad-soft: #3A1714;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
.num, td, .stat-value, .big { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.015em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.25rem); line-height: 1.1; }
h2 { font-size: 1.2rem; line-height: 1.25; }
h3 { font-size: 1rem; line-height: 1.3; }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; align-self: start;
  display: flex; flex-direction: column; gap: 4px; padding: 22px 14px;
  border-right: 1px solid var(--line); background: var(--surface);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; letter-spacing: -0.02em; }
.brand-sub { font-size: .72rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.nav-btn {
  display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 10px; border: 0; border-radius: 10px;
  background: transparent; color: var(--muted); font-weight: 500; cursor: pointer; text-align: left;
  transition: background .15s, color .15s;
}
.nav-btn svg { width: 19px; height: 19px; flex: none; }
.nav-btn:hover { background: var(--surface-2); color: var(--ink); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.rail-foot { margin-top: auto; display: grid; gap: 8px; padding: 12px 8px 0; border-top: 1px solid var(--line); font-size: .78rem; color: var(--muted); }
.save-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 1px; }

.main { min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 64px; }
.page { max-width: 1180px; margin: 0 auto; display: grid; gap: 22px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.eyebrow { font-size: .72rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); max-width: 62ch; margin-top: 6px; }

.mobile-top, .tabbar { display: none; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .mobile-top {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  }
  .main { padding: 18px 16px 110px; }
  .tabbar {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
    background: var(--surface); border-top: 1px solid var(--line); overflow-x: auto;
  }
  .tabbar .nav-btn { flex: 1 1 0; min-width: 50px; flex-direction: column; gap: 3px; padding: 6px 2px; font-size: .66rem; text-align: center; justify-content: center; }
}

/* ---------- Componentes ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.card-head p { color: var(--muted); font-size: .88rem; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
@media (max-width: 1080px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g-main { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) { .g2, .g3 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 420px) { .g4 { grid-template-columns: minmax(0, 1fr); } }

.stat { display: grid; gap: 4px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.stat-label { font-size: .78rem; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.stat-value { font-family: var(--font-display); font-size: 1.45rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; overflow-wrap: anywhere; }
.stat-note { font-size: .78rem; color: var(--faint); }
.missing { color: var(--faint); font-family: var(--font-body); font-size: .95rem; font-weight: 500; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 15px;
  border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: .9rem; cursor: pointer; transition: background .15s, border-color .15s, transform .1s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn-ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn-danger { color: var(--bad); }
.btn-sm { padding: 6px 10px; font-size: .82rem; border-radius: 8px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.icon-btn { border: 0; background: transparent; color: var(--faint); padding: 6px; border-radius: 8px; cursor: pointer; display: inline-grid; place-items: center; }
.icon-btn:hover { color: var(--ink); background: var(--surface-2); }
.icon-btn svg { width: 16px; height: 16px; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: .75rem; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st-concluido { background: var(--accent-soft); color: var(--accent); }
.st-no_caminho { background: var(--ok-soft); color: var(--ok); }
.st-revisao { background: var(--warn-soft); color: var(--warn); }
.st-abaixo { background: var(--bad-soft); color: var(--bad); }

.bar { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .5s cubic-bezier(.2,.8,.2,1); }

.notice { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-sm); font-size: .9rem; border: 1px solid; }
.notice svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.notice-info { background: var(--surface-2); border-color: var(--line); color: var(--muted); }
.notice-warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, transparent); color: var(--ink); }
.notice-bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 30%, transparent); color: var(--ink); }
.notice-ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 30%, transparent); color: var(--ink); }
.notice b { font-weight: 600; }
.stack { display: grid; gap: 10px; }

.demo-banner {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px;
  padding: 12px 16px; border-radius: var(--r); background: var(--gold-soft); border: 1px dashed color-mix(in srgb, var(--gold) 55%, transparent);
  font-size: .9rem;
}
.demo-banner b { color: var(--gold); }

/* Tabelas */
.table-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.row-actions { white-space: nowrap; text-align: right; width: 1%; }
.tag { display: inline-block; font-size: .72rem; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.empty { padding: 22px; text-align: center; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: var(--r-sm); font-size: .9rem; display: grid; gap: 10px; justify-items: center; }

/* Formulários */
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .field .label { font-size: .8rem; font-weight: 600; color: var(--muted); }
.field .hint, .hint { font-size: .76rem; color: var(--faint); }
.input, select.input, textarea.input {
  width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink); transition: border-color .15s, box-shadow .15s;
}
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input-pre { position: relative; }
.input-pre > span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: .85rem; pointer-events: none; }
.input-pre > .input { padding-left: 38px; }
.input-suf { position: relative; }
.input-suf > span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: .85rem; pointer-events: none; }
.input-suf > .input { padding-right: 34px; }
.form-grid { display: grid; align-items: start; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 520px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-size: .84rem; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: .9rem; }
.switch input { appearance: none; width: 38px; height: 22px; border-radius: 99px; background: var(--line-strong); position: relative; cursor: pointer; transition: background .15s; flex: none; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(16px); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.prio { display: inline-flex; gap: 3px; }
.prio button { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--surface); font-size: .8rem; font-weight: 700; color: var(--muted); cursor: pointer; }
.prio button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* Modal */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(8,14,12,.45); display: grid; place-items: center; padding: 16px; animation: fade .15s ease-out; }
.modal { width: min(560px, 100%); max-height: calc(100% - 32px); overflow: auto; background: var(--surface); border-radius: 18px; border: 1px solid var(--line); box-shadow: 0 30px 80px -20px rgba(0,0,0,.45); padding: 22px; display: grid; gap: 16px; animation: rise .2s cubic-bezier(.2,.8,.2,1); }
.modal-head { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.98); } }
.err { color: var(--bad); font-size: .85rem; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 80; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: .88rem; font-weight: 500; box-shadow: var(--shadow); animation: rise .2s; max-width: calc(100% - 32px); }
@media (max-width: 860px) { .toast { bottom: 92px; } }

/* ---------- Hero da visão geral ---------- */
.hero { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 26px 26px 22px; display: grid; gap: 18px; }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .55; }
.hero > *:not(canvas) { position: relative; }
.hero-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 18px 28px; align-items: flex-end; }
.big { font-family: var(--font-display); font-size: clamp(2.2rem, 1.6rem + 2.8vw, 3.6rem); font-weight: 600; letter-spacing: -0.035em; line-height: 1; overflow-wrap: anywhere; }
.big small { font-size: .45em; color: var(--muted); font-weight: 500; letter-spacing: -0.01em; }
.hero-figs { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.hero-figs div { display: grid; gap: 2px; }
.hero-figs span { font-size: .76rem; color: var(--muted); }
.hero-figs b { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; }

/* Rota dos objetivos */
.route { position: relative; padding: 8px 0 4px; overflow-x: auto; }
.route svg { display: block; min-width: 600px; width: 100%; height: auto; }
.route text { fill: var(--muted); font: 500 11px var(--font-body); }
.route .stop-name { fill: var(--ink); font-weight: 600; font-size: 12px; }

/* Objetivos */
.goals { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.goal-card { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; text-align: left; cursor: pointer; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); transition: border-color .15s, box-shadow .15s, transform .15s; color: var(--ink); width: 100%; }
.goal-card:hover { border-color: var(--line-strong); box-shadow: var(--shadow); transform: translateY(-1px); }
.goal-top { display: flex; align-items: center; gap: 12px; }
.goal-ico { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.goal-ico svg { width: 21px; height: 21px; }
.goal-title { min-width: 0; flex: 1; }
.goal-title h3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.goal-title p { font-size: .8rem; color: var(--muted); }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.kv div { display: grid; gap: 1px; min-width: 0; }
.kv span { font-size: .72rem; color: var(--muted); }
.kv b { font-weight: 600; font-size: .95rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.progress-line { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); margin-bottom: 6px; }

/* Gráficos */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .axis text { fill: var(--faint); font: 500 11px var(--font-body); font-variant-numeric: tabular-nums; }
.chart .grid-line { stroke: var(--line); stroke-width: 1; }
.chart .x-line { stroke: var(--ink); stroke-opacity: .25; stroke-dasharray: 3 3; }
.chart-tip { position: absolute; pointer-events: none; z-index: 5; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow); padding: 9px 11px; font-size: .78rem; min-width: 170px; display: grid; gap: 3px; }
.chart-tip .t { font-weight: 600; color: var(--ink); margin-bottom: 2px; }
.chart-tip .row { display: flex; justify-content: space-between; gap: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chart-tip .row b { color: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .8rem; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.legend i.dash { background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px) !important; height: 2px; }

/* Explicação de indicadores */
details.explain { font-size: .85rem; color: var(--muted); }
details.explain summary { cursor: pointer; font-weight: 600; color: var(--accent); list-style: none; display: inline-flex; gap: 6px; align-items: center; }
details.explain summary::-webkit-details-marker { display: none; }
details.explain[open] summary { margin-bottom: 8px; }
.formula { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .84rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: pre; color: var(--ink); }

.assume { display: flex; flex-wrap: wrap; gap: 6px; }
.assume .tag { font-size: .74rem; }

/* Comparação */
.delta-up { color: var(--ok); font-weight: 600; }
.delta-down { color: var(--bad); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .82rem; font-weight: 500; cursor: pointer; color: var(--ink); transition: background .15s, border-color .15s; }
.chip:hover { border-color: var(--accent); background: var(--accent-soft); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* Capacidade x necessidade */
.cap-bar { position: relative; height: 34px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); display: flex; overflow: hidden; }
.cap-bar > span { height: 100%; display: block; border-right: 2px solid var(--surface); }
.cap-mark { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--ink); }

.cap-wrap { padding-top: 22px; }
.cap-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: .8rem; color: var(--muted); }

.alt { display: grid; gap: 12px; }
.alt-head { display: flex; gap: 12px; align-items: flex-start; }
.alt-num { width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: .82rem; color: var(--muted); flex: none; }

/* Assistente */
.chat { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 520px; max-height: calc(100vh - 220px); padding: 0; overflow: hidden; }

.msg p + p { margin-top: 8px; }
.msg ul { margin: 6px 0; padding-left: 20px; }
.msg-user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.msg-ai { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg-meta { font-size: .72rem; color: var(--faint); margin-top: 6px; }
.chat { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 640px) { .chat .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; } .chat .chip { white-space: nowrap; flex: none; } }
#simResults ~ .card .input-suf .input, .card td .input-suf .input { min-width: 78px; }
.chat-input { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); background: var(--surface); }
.chat-input textarea { resize: none; min-height: 44px; max-height: 140px; }
.typing { display: inline-flex; gap: 4px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .25; } }

.section-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: .84rem; }
.right { text-align: right; }
.sep { height: 1px; background: var(--line); }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-weight: 600; font-size: .88rem; border: 0; background: none; cursor: pointer; padding: 4px 0; }
.back:hover { color: var(--ink); }
.back svg { width: 16px; height: 16px; }

.save-btn:hover { color: var(--ink); }

.rail-link { display: flex; align-items: center; gap: 8px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: .82rem; padding: 6px 0; }
.rail-link:hover { color: var(--accent); }

.rail-foot .save-btn, .rail-foot .btn-ghost { font-size: .78rem; }

.kv-painel div { padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); }
.kv-painel b { font-family: var(--font-display); font-size: 1.05rem; }
.kv-painel span + b + span { font-size: .72rem; color: var(--faint); }
.vinc { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); }
.vinc-chk { display: flex; align-items: center; gap: 10px; cursor: pointer; min-width: 0; }
.vinc-chk input { width: 17px; height: 17px; accent-color: var(--accent); flex: none; }
.vinc-chk span { display: grid; min-width: 0; }
.vinc-chk small { color: var(--muted); font-size: .76rem; }
.vinc-pct { width: 92px; flex: none; }
.login-card { max-width: 520px; margin: 6vh auto 0; padding: 28px; }
a.btn { text-decoration: none; }
.fontes { display: grid; margin-top: 18px; }
.fonte-row { display: grid; grid-template-columns: minmax(0, 1fr) 140px minmax(180px, 220px); gap: 8px 16px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.fonte-row:last-child { border-bottom: 0; }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/*
 * Atlas — motor financeiro
 * ------------------------------------------------------------------
 * Funções puras, sem interface, sem armazenamento e sem IA.
 *
 * Convenções:
 *  - Taxas entram como fração decimal (10% = 0.10).
 *  - Taxas anuais viram mensais por equivalência: (1+a)^(1/12) - 1.
 *  - Aportes acontecem no FIM de cada mês (série postecipada).
 *  - Com "considerar inflação" ligado, tudo é calculado em valores de
 *    hoje (termos reais): meta em poder de compra atual, taxa real,
 *    aporte corrigido pela inflação a cada mês.
 *  - Nada é arredondado aqui; arredondar é tarefa da exibição.
 */
(function (root) {
  'use strict';

  const MAX_MESES = 1200; // 100 anos: além disso, tratamos como inalcançável

  function assertNum(v, nome) {
    if (typeof v !== 'number' || !Number.isFinite(v)) {
      throw new TypeError(nome + ' precisa ser um número finito');
    }
  }
  function assertTaxa(i, nome) {
    assertNum(i, nome);
    if (i <= -1) throw new RangeError(nome + ' precisa ser maior que -100%');
  }

  /* ---------- Taxas ---------- */

  function anualParaMensal(a) {
    assertTaxa(a, 'Taxa anual');
    return Math.pow(1 + a, 1 / 12) - 1;
  }

  function mensalParaAnual(m) {
    assertTaxa(m, 'Taxa mensal');
    return Math.pow(1 + m, 12) - 1;
  }

  /** Taxa real exata (equação de Fisher): (1+nominal)/(1+inflação) - 1 */
  function taxaReal(nominal, inflacao) {
    assertTaxa(nominal, 'Rentabilidade nominal');
    assertTaxa(inflacao, 'Inflação');
    return (1 + nominal) / (1 + inflacao) - 1;
  }

  /** Converte um valor de hoje para o valor nominal equivalente daqui a n meses. */
  function corrigirPelaInflacao(valorHoje, inflacaoAnual, meses) {
    assertNum(valorHoje, 'Valor');
    assertTaxa(inflacaoAnual, 'Inflação');
    return valorHoje * Math.pow(1 + inflacaoAnual, meses / 12);
  }

  /** Converte um valor nominal futuro para poder de compra de hoje. */
  function deflacionar(valorFuturo, inflacaoAnual, meses) {
    assertNum(valorFuturo, 'Valor');
    assertTaxa(inflacaoAnual, 'Inflação');
    return valorFuturo / Math.pow(1 + inflacaoAnual, meses / 12);
  }

  /* ---------- Valor futuro e séries ---------- */

  /**
   * Valor futuro com aporte constante no fim do mês.
   * VF = VP(1+i)^n + PMT[(1+i)^n - 1]/i ;  com i = 0: VF = VP + PMT·n
   */
  function valorFuturo(vp, i, n, pmt) {
    assertNum(vp, 'Saldo inicial');
    assertTaxa(i, 'Rentabilidade');
    assertNum(n, 'Prazo');
    assertNum(pmt, 'Aporte');
    if (n < 0 || !Number.isInteger(n)) throw new RangeError('Prazo precisa ser um número inteiro de meses ≥ 0');
    if (i === 0) return vp + pmt * n;
    const f = Math.pow(1 + i, n);
    return vp * f + pmt * (f - 1) / i;
  }

  /**
   * Evolução mês a mês com aportes variáveis (aportes[k] = aporte do mês k+1).
   * Valores negativos representam retiradas. Retorna saldos de 0..n.
   */
  function serie(vp, i, aportes) {
    assertNum(vp, 'Saldo inicial');
    assertTaxa(i, 'Rentabilidade');
    if (!Array.isArray(aportes)) throw new TypeError('Aportes precisam ser uma lista');
    const s = [vp];
    let saldo = vp;
    for (const a of aportes) {
      assertNum(a, 'Aporte');
      saldo = saldo * (1 + i) + a;
      s.push(saldo);
    }
    return s;
  }

  /** Lista de aportes de n meses, com pausa opcional (meses 1-index, inclusive). */
  function cronogramaAportes(n, pmt, pausa) {
    const lista = new Array(n).fill(pmt);
    if (pausa && pausa.meses > 0) {
      const ini = Math.max(1, pausa.inicio || 1);
      for (let m = ini; m < ini + pausa.meses && m <= n; m++) lista[m - 1] = 0;
    }
    return lista;
  }

  /* ---------- Aporte necessário ---------- */

  /**
   * Aporte mensal constante necessário para atingir `meta` em n meses.
   * Retorna 0 se o saldo (com rendimento) já basta.
   * Retorna Infinity se n = 0 e a meta ainda não foi atingida.
   * `pausa` (opcional) zera os aportes de alguns meses.
   */
  function aporteNecessario(meta, vp, i, n, pausa) {
    assertNum(meta, 'Meta');
    assertNum(vp, 'Saldo inicial');
    assertTaxa(i, 'Rentabilidade');
    assertNum(n, 'Prazo');
    if (meta < 0) throw new RangeError('Meta não pode ser negativa');
    if (n < 0 || !Number.isInteger(n)) throw new RangeError('Prazo precisa ser um número inteiro de meses ≥ 0');
    const fatorVP = Math.pow(1 + i, n);
    const falta = meta - vp * fatorVP;
    if (falta <= 0) return 0;
    if (n === 0) return Infinity;
    // Soma dos fatores de capitalização dos meses com aporte ativo
    const ativos = cronogramaAportes(n, 1, pausa);
    let soma = 0;
    for (let k = 1; k <= n; k++) if (ativos[k - 1]) soma += Math.pow(1 + i, n - k);
    if (soma <= 0) return Infinity;
    return falta / soma;
  }

  /* ---------- Prazo estimado ---------- */

  /**
   * Meses (inteiros) até o saldo atingir a meta.
   * n = ln[(VF·i + PMT)/(VP·i + PMT)] / ln(1+i) ; com i = 0: (VF-VP)/PMT
   * Retorna Infinity se a meta for inalcançável ou exigir mais de 100 anos.
   */
  function mesesParaMeta(meta, vp, i, pmt) {
    assertNum(meta, 'Meta');
    assertNum(vp, 'Saldo inicial');
    assertTaxa(i, 'Rentabilidade');
    assertNum(pmt, 'Aporte');
    if (vp >= meta) return 0;
    let n;
    if (i === 0) {
      if (pmt <= 0) return Infinity;
      n = (meta - vp) / pmt;
    } else {
      const num = meta * i + pmt;
      const den = vp * i + pmt;
      if (num <= 0 || den <= 0) return Infinity;
      const r = num / den;
      if (r <= 0) return Infinity;
      n = Math.log(r) / Math.log(1 + i);
      if (!Number.isFinite(n) || n < 0) return Infinity;
    }
    // Tolerância para erros de ponto flutuante antes do arredondamento para cima
    const inteiro = Math.ceil(n - 1e-9);
    return inteiro > MAX_MESES ? Infinity : inteiro;
  }

  /** Maior meta alcançável em n meses com o aporte dado (inverso de aporteNecessario). */
  function metaAlcancavel(vp, i, n, pmt) {
    return valorFuturo(vp, i, n, pmt);
  }

  /* ---------- Datas ---------- */

  /** 'AAAA-MM' -> {ano, mes} */
  function lerMes(s) {
    const m = /^(\d{4})-(\d{2})$/.exec(String(s || ''));
    if (!m) throw new TypeError('Data precisa estar no formato AAAA-MM');
    const ano = +m[1], mes = +m[2];
    if (mes < 1 || mes > 12) throw new RangeError('Mês inválido');
    return { ano, mes };
  }
  function mesesEntre(deAAAAMM, ateAAAAMM) {
    const a = lerMes(deAAAAMM), b = lerMes(ateAAAAMM);
    return (b.ano - a.ano) * 12 + (b.mes - a.mes);
  }
  function somarMeses(aaaamm, n) {
    const a = lerMes(aaaamm);
    const total = a.ano * 12 + (a.mes - 1) + n;
    const ano = Math.floor(total / 12), mes = (total % 12) + 1;
    return ano + '-' + String(mes).padStart(2, '0');
  }
  function mesAtual(data) {
    const d = data || new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  /* ---------- Diagnóstico ---------- */

  const soma = (lista, campo) => (lista || []).reduce((t, x) => t + (Number(x[campo]) || 0), 0);

  /**
   * Indicadores da situação financeira. Campos ausentes viram `null`,
   * nunca valores inventados.
   */
  function diagnostico(d) {
    const rendas = d.rendas || [], despesas = d.despesas || [];
    const ativos = d.ativos || [], passivos = d.passivos || [];
    const objetivos = (d.objetivos || []).filter(o => !o.arquivado);

    const rendaTotal = rendas.length ? soma(rendas, 'valor') : null;
    const rendaFixa = rendas.length ? soma(rendas.filter(r => r.tipo !== 'variavel'), 'valor') : null;
    const despOrd = despesas.length ? soma(despesas.filter(x => x.tipo !== 'extraordinaria'), 'valor') : null;
    const despExtra = despesas.length ? soma(despesas.filter(x => x.tipo === 'extraordinaria'), 'valor') : null;
    const parcelas = soma(passivos, 'parcela');

    const totalAtivos = soma(ativos, 'valor');
    const totalPassivos = soma(passivos, 'saldo');
    const financeiros = ativos.filter(a => ['conta', 'investimento', 'reserva'].includes(a.tipo));
    const patrimonioFinanceiro = soma(financeiros, 'valor');
    const patrimonioInvestido = soma(ativos.filter(a => a.tipo === 'investimento'), 'valor');
    const reserva = soma(ativos.filter(a => a.tipo === 'reserva'), 'valor');
    const alocadoEmObjetivos = soma(objetivos, 'acumulado');

    // Capacidade: renda total menos TODAS as despesas (extraordinárias em média
    // mensal) e as parcelas de dívidas. A "recorrente" ignora renda variável e
    // despesas extraordinárias, para mostrar o que sobra num mês típico garantido.
    let capacidadeCalculada = null, capacidadeRecorrente = null, taxaPoupanca = null;
    if (rendaTotal !== null && despOrd !== null) {
      capacidadeCalculada = rendaTotal - despOrd - despExtra - parcelas;
      capacidadeRecorrente = rendaFixa - despOrd - parcelas;
      taxaPoupanca = rendaTotal > 0 ? capacidadeCalculada / rendaTotal : null;
    }
    const manual = d.config && d.config.capacidadeManual;
    const capacidade = (typeof manual === 'number' && manual >= 0) ? manual : capacidadeCalculada;

    const custoMensal = despOrd !== null ? despOrd + parcelas : null;
    const mesesReserva = custoMensal ? reserva / custoMensal : null;

    const pendencias = [];
    if (!rendas.length) pendencias.push('Cadastre suas fontes de renda');
    if (!despesas.length) pendencias.push('Cadastre suas despesas mensais');
    if (!ativos.length) pendencias.push('Cadastre seus ativos (contas, investimentos, bens)');
    if (!objetivos.length) pendencias.push('Crie seu primeiro objetivo');

    const alertas = [];
    if (alocadoEmObjetivos > patrimonioFinanceiro + 0.005) {
      alertas.push('Os valores reservados nos objetivos somam mais do que seus ativos financeiros. Revise para não contar o mesmo dinheiro duas vezes.');
    }
    if (capacidade !== null && capacidade < 0) alertas.push('Suas despesas superam sua renda.');

    return {
      rendaTotal, rendaFixa, rendaVariavel: rendaTotal !== null ? rendaTotal - rendaFixa : null,
      despesasOrdinarias: despOrd, despesasExtraordinarias: despExtra, parcelas,
      totalAtivos, totalPassivos, patrimonioLiquido: totalAtivos - totalPassivos,
      patrimonioFinanceiro, patrimonioInvestido, patrimonioNaoFinanceiro: totalAtivos - patrimonioFinanceiro,
      reserva, mesesReserva, alocadoEmObjetivos,
      livreParaObjetivos: patrimonioFinanceiro - alocadoEmObjetivos,
      capacidadeCalculada, capacidadeRecorrente, capacidade, capacidadeManual: capacidade !== capacidadeCalculada,
      taxaPoupanca, pendencias, alertas
    };
  }

  /* ---------- Objetivos ---------- */

  /**
   * Premissas de um cenário convertidas para o cálculo.
   * cenario = { rentabilidade: 0.10, inflacao: 0.045, ajusteAporte: 0 }
   */
  function premissas(cenario, considerarInflacao) {
    const rent = cenario.rentabilidade, infl = cenario.inflacao;
    assertTaxa(rent, 'Rentabilidade'); assertTaxa(infl, 'Inflação');
    const anualUsada = considerarInflacao ? taxaReal(rent, infl) : rent;
    return {
      rentabilidadeAnual: rent, inflacaoAnual: infl,
      taxaAnualUsada: anualUsada, taxaMensal: anualParaMensal(anualUsada),
      ajusteAporte: cenario.ajusteAporte || 0, considerarInflacao: !!considerarInflacao
    };
  }

  /**
   * Análise completa de um objetivo num cenário.
   * opts: { hoje:'AAAA-MM', ajustes:{aporteDelta, prazoDelta, saldo, pausa, alvo} }
   */
  function analisarObjetivo(obj, cenario, considerarInflacao, opts) {
    const o = opts || {};
    const hoje = o.hoje || mesAtual();
    const aj = o.ajustes || {};
    const p = premissas(cenario, considerarInflacao);
    const alvo = aj.alvo != null ? aj.alvo : obj.alvo;
    const acumulado = aj.saldo != null ? aj.saldo : (obj.acumulado || 0);
    const n0 = mesesEntre(hoje, obj.dataAlvo);
    const n = Math.max(0, n0 + (aj.prazoDelta || 0));
    const aporteBase = (obj.aporte || 0) + (aj.aporteDelta || 0);
    const aporte = Math.max(0, aporteBase * (1 + p.ajusteAporte));
    const i = p.taxaMensal;

    const cron = cronogramaAportes(n, aporte, aj.pausa);
    const saldos = serie(acumulado, i, cron);

function projecaoGeral(c) {
  if (!c.base.length) return '<div class="empty">Sem objetivos para projetar.</div>';
  const H = Math.min(480, Math.max(12, ...c.base.map(x => x.a.meses)));
  const i = E.premissas(S.config.cenarios.base, S.config.considerarInflacao).taxaMensal;
  const vals = new Array(H + 1).fill(0);
  c.base.forEach(({ o, a }) => {

      if (k <= a.meses) vals[k] += a.saldos[k];

  const markers = c.base.filter(x => !CAT_PERMANENTE.includes(x.o.categoria) && x.a.meses <= H).map(x => ({ k: x.a.meses, label: x.o.nome }));

  const all = opt.series.flatMap(s => s.values.filter(fin));
  const { ticks, top } = niceTicks(Math.max(opt.target ? opt.target.value : 0, ...all) * 1.04);
  const x = k => L + (k / n) * (W - L - R), y = v => T + (1 - Math.max(0, v) / top) * (H - T - B);
  let g = '<g class="axis">' + ticks.map(v => '<line class="grid-line" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (L - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + brlC(v) + '</text>').join('');
  const anos = n / 12, passo = [1, 2, 5, 10, 20].find(p => anos / p <= (narrow ? 4 : 6)) || 25;
  const ano0 = E.lerMes(hoje()).ano;
  for (let a = 0; a * 12 <= n; a += passo) if (n >= 24 || a === 0) g += '<text x="' + x(a * 12) + '" y="' + (H - 6) + '" text-anchor="' + (a === 0 ? 'start' : 'middle') + '">' + (a === 0 ? 'Hoje' : ano0 + a) + '</text>';
  if (n < 24) { const m = Math.floor(n / 2); if (m > 0) g += '<text x="' + x(m) + '" y="' + (H - 6) + '" text-anchor="middle">' + mesLabel(E.somarMeses(hoje(), m)) + '</text>'; g += '<text x="' + x(n) + '" y="' + (H - 6) + '" text-anchor="end">' + mesLabel(E.somarMeses(hoje(), n)) + '</text>'; }
  g += '</g>';
  (opt.markers || []).forEach(m => { g += '<line x1="' + x(m.k) + '" x2="' + x(m.k) + '" y1="' + T + '" y2="' + (H - B) + '" style="stroke:var(--line-strong);stroke-dasharray:2 4"/><circle cx="' + x(m.k) + '" cy="' + (H - B) + '" r="3" style="fill:var(--gold)"><title>' + esc(m.label) + '</title></circle>'; });
  if (opt.target) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(opt.target.value) + '" y2="' + y(opt.target.value) + '" style="stroke:var(--ink);stroke-opacity:.55;stroke-dasharray:6 5;stroke-width:1.5"/><text x="' + (W - R) + '" y="' + (y(opt.target.value) - 6) + '" text-anchor="end" style="fill:var(--ink);font:600 11px var(--font-body)">' + esc(opt.target.label || 'Meta') + ' ' + brlC(opt.target.value) + '</text>';
  opt.series.forEach((s, si) => {
    const d = s.values.map((v, k) => (k ? 'L' : 'M') + x(k).toFixed(1) + ' ' + y(v).toFixed(1)).join('');
    if (s.area) g += '<path d="' + d + 'L' + x(s.values.length - 1) + ' ' + y(0) + 'L' + x(0) + ' ' + y(0) + 'Z" style="fill:' + s.color + ';fill-opacity:.12"/>';
    g += '<path d="' + d + '" style="fill:none;stroke:' + s.color + ';stroke-width:' + (s.dash ? 1.8 : 2.4) + ';stroke-linejoin:round;stroke-linecap:round' + (s.dash ? ';stroke-dasharray:5 5' : '') + '"/>';
    const last = s.values.length - 1;
    if (!s.dash) g += '<circle cx="' + x(last) + '" cy="' + y(s.values[last]) + '" r="3.5" style="fill:' + s.color + '"/>';
  });
  g += '<line class="x-line" data-x x1="0" x2="0" y1="' + T + '" y2="' + (H - B) + '" style="visibility:hidden"/>';
  opt.series.forEach((s, si) => { g += '<circle data-dot="' + si + '" r="4.5" style="fill:var(--surface);stroke:' + s.color + ';stroke-width:2.5;visibility:hidden"/>'; });
  CHARTS.set(id, { W, H, L, R, T, B, n, top, opt, x, y });
  const legend = opt.series.length > 1 || opt.target ? '<div class="legend">' + opt.series.map(s => '<span><i class="' + (s.dash ? 'dash' : '') + '" style="background:' + s.color + ';color:' + s.color + '"></i>' + esc(s.name) + '</span>').join('') + (opt.target ? '<span><i class="dash" style="color:var(--ink)"></i>' + esc(opt.target.label || 'Meta') + '</span>' : '') + '</div>' : '';
  return '<div class="chart" data-chart="' + id + '"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Gráfico de projeção">' + g + '</svg><div class="chart-tip" hidden></div></div>' + legend;
}
function chartHover(e) {
  const el = e.target.closest('.chart'); if (!el) return;
  const c = CHARTS.get(el.dataset.chart); if (!c) return;
  const svg = el.querySelector('svg'), r = svg.getBoundingClientRect();
  const px = (e.clientX - r.left) * c.W / r.width;
  const k = Math.max(0, Math.min(c.n, Math.round((px - c.L) / (c.W - c.L - c.R) * c.n)));
  const xl = svg.querySelector('[data-x]'); xl.setAttribute('x1', c.x(k)); xl.setAttribute('x2', c.x(k)); xl.style.visibility = 'visible';
  let rows = '';
  c.opt.series.forEach((s, si) => {
    const v = s.values[Math.min(k, s.values.length - 1)];
    const dot = svg.querySelector('[data-dot="' + si + '"]');
    if (k < s.values.length) { dot.setAttribute('cx', c.x(k)); dot.setAttribute('cy', c.y(v)); dot.style.visibility = 'visible'; } else dot.style.visibility = 'hidden';
    rows += '<div class="row"><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:' + s.color + '"></i>' + esc(s.name) + '</span><b>' + brl(k < s.values.length ? v : NaN) + '</b></div>';
  });
  if (c.opt.target) rows += '<div class="row"><span>' + esc(c.opt.target.label || 'Meta') + '</span><b>' + brl(c.opt.target.value) + '</b></div>';
  const tip = el.querySelector('.chart-tip');
  tip.innerHTML = '<div class="t">' + mesLongo(E.somarMeses(hoje(), k)) + ' <span class="muted" style="font-weight:500">· mês ' + k + '</span></div>' + rows;
  tip.hidden = false;
  const left = c.x(k) / c.W * r.width;
  tip.style.left = (left + 190 > r.width ? Math.max(0, left - 190) : left + 12) + 'px';
  tip.style.top = '6px';
}
function chartLeave(e) {
  const el = e.target.closest && e.target.closest('.chart'); if (!el) return;

    const n2 = E.mesesParaMeta(a.alvo, a.acumulado, i, o.aporte || 0);
    caminhos = '<div class="notice notice-bad">' + ico('warn') + '<div>A data-alvo já chegou e faltam ' + brl(a.alvo - a.acumulado) + '. ' + (fin(n2) ? 'Com o aporte atual, a meta seria atingida em <b>' + mesLongo(E.somarMeses(hoje(), n2)) + '</b>.' : 'Com o aporte atual a meta não é alcançada.') + '</div></div>' +
      (fin(n2) ? '<div class="btn-row"><button class="btn btn-sm" data-act="applyGoal" data-id="' + o.id + '" data-campo="dataAlvo" data-valor="' + E.somarMeses(hoje(), n2) + '">Mudar data para ' + mesLabel(E.somarMeses(hoje(), n2)) + '</button></div>' : '');
  } else {
    const nAdiar = E.mesesParaMeta(a.alvo, a.acumulado, i, o.aporte || 0);
    const metaPossivel = E.valorFuturo(a.acumulado, i, a.meses, o.aporte || 0);
    const linha = (num, titulo, texto, botao) => '<div class="alt"><div class="alt-head"><div class="alt-num">' + num + '</div><div style="flex:1;min-width:0"><h3>' + titulo + '</h3><p class="small muted" style="margin-top:2px">' + texto + '</p></div></div>' + (botao ? '<div style="padding-left:40px">' + botao + '</div>' : '') + '</div>';
    if (a.status === 'no_caminho') {
      caminhos = '<div class="notice notice-ok">' + ico('check') + '<div>No cenário base, o aporte planejado leva a ' + brl(a.projetado) + ' no prazo, ' + brl(a.diferenca) + ' acima da meta.</div></div>' +
        (o.aporte - a.aporteNecessario > 1 ? linha(1, 'Liberar parte do aporte', 'O aporte necessário é ' + brl(a.aporteNecessario) + '/mês. A diferença de ' + brl(o.aporte - a.aporteNecessario) + ' poderia ir para outro objetivo. Considere a margem de segurança do cenário conservador antes de reduzir.', '<button class="btn btn-sm" data-act="applyGoal" data-id="' + o.id + '" data-campo="aporte" data-valor="' + Math.ceil(a.aporteNecessario) + '">Usar ' + brl(Math.ceil(a.aporteNecessario)) + '/mês</button>') : '');
    } else {
      caminhos = '<div class="stack" style="gap:16px">' +
        linha(1, 'Aumentar o aporte', 'Manter prazo e meta exige ' + brl(a.aporteNecessario) + '/mês, ' + brl(a.aporteNecessario - o.aporte) + ' a mais do que o planejado.', '<button class="btn btn-sm" data-act="applyGoal" data-id="' + o.id + '" data-campo="aporte" data-valor="' + Math.ceil(a.aporteNecessario) + '">Aplicar ' + brl(Math.ceil(a.aporteNecessario)) + '/mês</button>') +
        linha(2, 'Adiar o prazo', fin(nAdiar) ? 'Com ' + brl(o.aporte) + '/mês, a meta chega em ' + mesLongo(E.somarMeses(hoje(), nAdiar)) + ' (' + duracao(nAdiar - a.meses) + ' depois).' : 'Com o aporte atual, a meta não é alcançada em nenhum prazo razoável.', fin(nAdiar) ? '<button class="btn btn-sm" data-act="applyGoal" data-id="' + o.id + '" data-campo="dataAlvo" data-valor="' + E.somarMeses(hoje(), nAdiar) + '">Mudar para ' + mesLabel(E.somarMeses(hoje(), nAdiar)) + '</button>' : '') +
        linha(3, 'Reduzir a meta', 'Mantendo prazo e aporte, o valor alcançável é ' + brl(metaPossivel) + ' (' + pct((a.alvo - metaPossivel) / a.alvo, 0) + ' menos).', '<button class="btn btn-sm" data-act="applyGoal" data-id="' + o.id + '" data-campo="alvo" data-valor="' + Math.floor(metaPossivel) + '">Mudar meta para ' + brl(Math.floor(metaPossivel)) + '</button>') +
      '</div>';
    }
  }
  const cenRows = Object.keys(CEN).map(k => {
    const x = an[k], p = x.premissas;
    const proj = nominal ? x.projetadoNominal : x.projetado, dif = nominal ? x.projetadoNominal - x.alvoNominal : x.diferenca;
    return '<tr><td><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:' + CEN_COR[k] + ';margin-right:8px"></span><b>' + CEN[k] + '</b><div class="small muted">' + pct(p.rentabilidadeAnual) + ' a.a.' + (inf ? ' − inflação ' + pct(p.inflacaoAnual) + ' = ' + pct(p.taxaAnualUsada, 2) + ' real' : '') + (p.ajusteAporte ? ' · aporte ' + (p.ajusteAporte > 0 ? '+' : '') + pct(p.ajusteAporte, 0) : '') + '</div></td>' +
      '<td class="r">' + brl(proj) + '</td><td class="r ' + (dif >= 0 ? 'delta-up' : 'delta-down') + '">' + (dif >= 0 ? '+' : '−') + brl(Math.abs(dif)) + '</td>' +
      '<td class="r">' + (x.status === 'concluido' ? '—' : fin(x.aporteNecessario) ? brl(x.aporteNecessario) : 'vencido') + '</td><td class="r">' + (x.dataEstimada ? mesLabel(x.dataEstimada) : 'não alcança') + '</td></tr>';
  }).join('');
  return '<div class="page">' +
    '<div><button class="back" data-act="go" data-view="objetivos">' + ico('back') + 'Objetivos</button></div>' +
    '<div class="page-head"><div class="goal-top" style="align-items:flex-start"><div class="goal-ico" style="width:52px;height:52px;border-radius:14px">' + ico(o.categoria, ' style="width:26px;height:26px"') + '</div><div><div class="eyebrow">' + CATS[o.categoria] + ' · prioridade ' + o.prioridade + ' · ' + FLEX[o.flex] + '</div><h1>' + esc(o.nome) + '</h1>' + (o.descricao ? '<p class="lede">' + esc(o.descricao) + '</p>' : '') + '<div style="margin-top:10px">' + pill(a.status) + (o.arquivado ? ' <span class="tag">Arquivado</span>' : '') + '</div></div></div>' +
      '<div class="btn-row"><button class="btn" data-act="editGoal" data-id="' + o.id + '">' + ico('edit') + 'Editar</button><button class="btn" data-act="simGoal" data-id="' + o.id + '">' + ico('sim') + 'Simular</button><button class="btn btn-ghost" data-act="archiveGoal" data-id="' + o.id + '">' + ico('archive') + (o.arquivado ? 'Reativar' : 'Arquivar') + '</button><button class="btn btn-ghost btn-danger" data-act="delGoal" data-id="' + o.id + '">' + ico('trash') + 'Excluir</button></div></div>' +
    '<div class="grid g4">' +
      stat('Meta', brl(a.alvo), inf ? 'Em valores de hoje. Na data-alvo: ' + brl(a.alvoNominal) + ' (cenário base)' : 'Valor nominal') +
      stat('Reservado', brl(a.acumulado), pct(a.progresso, 0) + ' da meta' + (o.vinculado ? '<br>Do painel: ' + o.vinculos.map(v => esc(fonteNome(v.key)) + (v.pct < 100 ? ' (' + v.pct + '%)' : '')).join(', ') : '')) +
      stat('Prazo', mesLabel(o.dataAlvo), a.meses > 0 ? 'Faltam ' + duracao(a.meses) : 'Data-alvo atingida') +
      stat('Aporte planejado', brl(o.aporte), a.status === 'concluido' ? 'Meta atingida' : 'Necessário: ' + (fin(a.aporteNecessario) ? brl(a.aporteNecessario) : 'prazo vencido')) +
    '</div>' +
    '<div class="grid g-main">' +
      '<section class="card"><div class="card-head"><div><h2>Projeção da evolução</h2><p>Aporte planejado em cada cenário. Linha tracejada: a meta.</p></div>' +
        (inf ? '<div class="seg"><button data-act="modo" data-v="real" aria-pressed="' + !nominal + '">Valores de hoje</button><button data-act="modo" data-v="nominal" aria-pressed="' + nominal + '">Nominais</button></div>' : '') + '</div>' +
        (a.meses > 0 ? lineChart('goal', { n: a.meses, series, target: { value: alvoGraf, label: 'Meta' } }) : '<div class="empty">A data-alvo já chegou, não há evolução para projetar.</div>') +
      '</section>' +
      '<section class="card"><div class="card-head"><div><h2>Caminhos para chegar lá</h2><p>Cenário base. Nada muda sem sua confirmação.</p></div></div>' + caminhos + '</section>' +
    '</div>' +
    '<section class="card"><div class="card-head"><div><h2>Comparação de cenários</h2><p>' + (nominal ? 'Valores nominais, na moeda da data-alvo.' : inf ? 'Valores em poder de compra de hoje.' : 'Valores nominais, sem considerar inflação.') + '</p></div></div>' +
      '<div class="table-wrap"><table><thead><tr><th>Cenário e premissas</th><th class="r">Saldo no prazo</th><th class="r">Diferença p/ meta</th><th class="r">Aporte necessário</th><th class="r">Data estimada</th></tr></thead><tbody>' + cenRows + '</tbody></table></div>' +
      '<p class="small muted" style="margin-top:12px">Cenários são hipóteses, não promessas. Rentabilidades maiores costumam vir com mais risco, menos liquidez ou prazos mais longos. Impostos e taxas não estão incluídos: informe a rentabilidade já líquida.</p>' +
    '</section>' +
  '</div>';
}

/* =================== Simulações =================== */
function simDe(o) {
  const c = JSON.parse(JSON.stringify(S.config.cenarios));
  return { goalId: o.id, aporte: o.aporte || 0, dataAlvo: o.dataAlvo, saldo: o.acumulado || 0, alvo: o.alvo, pausaMeses: 0, pausaInicio: 1, cen: c, preset: null };
}
function vSimulacoes() {
  const ativos = V().objetivos.filter(o => !o.arquivado);
  if (!ativos.length) return '<div class="page">' + head('Módulo 3', 'Simulações') + '<div class="empty">Crie um objetivo para simular cenários.<button class="btn btn-primary" data-act="newGoal">' + ico('plus') + 'Criar objetivo</button></div></div>';
  let o = ui.sim && V().objetivos.find(x => x.id === ui.sim.goalId);
  if (!o) { o = ativos[0]; ui.sim = simDe(o); }
  const s = ui.sim;
  const maxAporte = Math.max(2000, Math.ceil(Math.max(o.aporte * 3, analisar(o, 'base').aporteNecessario || 0, s.aporte) * 1.2 / 100) * 100);
  const cenInputs = Object.keys(CEN).map(k => '<tr><td><b>' + CEN[k] + '</b></td>' +
    '<td><div class="input-suf"><input class="input" type="number" step="0.1" id="sim-r-' + k + '" data-sim="rent" data-cen="' + k + '" value="' + pctIn(s.cen[k].rentabilidade) + '"><span>%</span></div></td>' +
    '<td><div class="input-suf"><input class="input" type="number" step="0.1" id="sim-i-' + k + '" data-sim="infl" data-cen="' + k + '" value="' + pctIn(s.cen[k].inflacao) + '"><span>%</span></div></td></tr>').join('');
  const presets = [['mais200', '+ R$ 200/mês'], ['adiar12', 'Adiar 1 ano'], ['rentMenos2', 'Rentabilidade 2 p.p. menor'], ['pausa6', 'Pausar aportes por 6 meses'], ['inflMais2', 'Inflação 2 p.p. maior']];
  return '<div class="page">' + head('Módulo 3', 'Simulações', 'Teste mudanças sem tocar no plano oficial. Para valer, use “Aplicar ao plano” e confirme.') +
    '<div class="chips">' + presets.map(([k, l]) => '<button class="chip" data-act="preset" data-k="' + k + '">' + l + '</button>').join('') + '<button class="chip" data-act="simReset">Restaurar valores do plano</button></div>' +
    '<div class="grid g-main" style="align-items:start">' +
      '<div id="simResults" class="stack" style="gap:16px">' + simResultados() + '</div>' +
      '<section class="card stack" style="gap:16px"><div><h2>Parâmetros</h2></div>' +
        '<div class="field"><label for="simGoal">Objetivo</label><select class="input" id="simGoal" data-change="simGoal">' + ativos.map(x => '<option value="' + x.id + '"' + (x.id === o.id ? ' selected' : '') + '>' + esc(x.nome) + '</option>').join('') + '</select></div>' +
        '<div class="field"><label for="sim-aporte">Aporte mensal</label><div class="input-pre"><span>R$</span><input class="input" type="number" min="0" step="50" id="sim-aporte" data-sim="aporte" value="' + s.aporte + '"></div><input type="range" min="0" max="' + maxAporte + '" step="50" id="sim-aporte-r" data-sim="aporte" value="' + s.aporte + '" aria-label="Aporte mensal"></div>' +
        '<div class="form-grid"><div class="field"><label for="sim-data">Data-alvo</label><input class="input" type="month" id="sim-data" data-sim="dataAlvo" value="' + s.dataAlvo + '"></div>' +
        '<div class="field"><label for="sim-saldo">Saldo inicial</label><div class="input-pre"><span>R$</span><input class="input" type="number" min="0" step="100" id="sim-saldo" data-sim="saldo" value="' + s.saldo + '"></div></div></div>' +
        '<div class="field"><label for="sim-alvo">Meta</label><div class="input-pre"><span>R$</span><input class="input" type="number" min="0" step="500" id="sim-alvo" data-sim="alvo" value="' + s.alvo + '"></div></div>' +
        '<div class="form-grid"><div class="field"><label for="sim-pausa">Pausar aportes (meses)</label><input class="input" type="number" min="0" max="120" id="sim-pausa" data-sim="pausaMeses" value="' + s.pausaMeses + '"></div>' +
        '<div class="field"><label for="sim-pini">A partir do mês nº</label><input class="input" type="number" min="1" id="sim-pini" data-sim="pausaInicio" value="' + s.pausaInicio + '"></div></div>' +
        '<div class="field"><span class="label">Premissas por cenário (ao ano)</span><div class="table-wrap"><table><thead><tr><th></th><th>Rentab.</th><th>Inflação</th></tr></thead><tbody>' + cenInputs + '</tbody></table></div></div>' +
        '<div class="btn-row"><button class="btn btn-primary" data-act="simApply">Aplicar ao plano</button></div>' +
      '</section>' +
    '</div></div>';
}
function simObj() {
  const o = V().objetivos.find(x => x.id === ui.sim.goalId), s = ui.sim;
  return Object.assign({}, o, { aporte: s.aporte, dataAlvo: s.dataAlvo, acumulado: s.saldo, alvo: s.alvo });
}
function simResultados() {
  const s = ui.sim, o = V().objetivos.find(x => x.id === s.goalId);
  let erro = null;
  try { E.lerMes(s.dataAlvo); [s.aporte, s.saldo, s.alvo].forEach(v => { if (!fin(v) || v < 0) throw new Error('valores precisam ser números ≥ 0'); }); Object.values(s.cen).forEach(c => { if (!(c.rentabilidade > -1) || !(c.inflacao > -1)) throw new Error('taxas precisam ser maiores que −100%'); }); }
  catch (e) { erro = e.message; }
  if (erro) return '<div class="notice notice-bad">' + ico('warn') + '<div>Revise os parâmetros: ' + esc(erro) + '.</div></div>';
  const pausa = s.pausaMeses > 0 ? { inicio: s.pausaInicio || 1, meses: s.pausaMeses } : null;
  const so = simObj();
  const sim = {}, orig = {};
  Object.keys(CEN).forEach(k => { sim[k] = analisar(so, k, { pausa }, s.cen[k]); orig[k] = analisar(o, k); });
  const n = Math.max(sim.base.meses, orig.base.meses, 1);
  const series = Object.keys(CEN).map(k => ({ name: CEN[k] + ' (simulado)', color: CEN_COR[k], values: sim[k].saldos }));
  series.push({ name: 'Plano atual (base)', color: 'var(--muted)', values: orig.base.saldos, dash: true });
  const linha = (rot, f, fmtDelta) => '<tr><td>' + rot + '</td>' + Object.keys(CEN).map(k => { const a = f(orig[k]), b = f(sim[k]); return '<td class="r">' + b.txt + (fmtDelta ? '<div class="small">' + fmtDelta(a, b) + '</div>' : '') + '</td>'; }).join('') + '</tr>';
  const dMoney = (a, b) => { if (!fin(a.v) || !fin(b.v)) return '<span class="muted">antes: ' + a.txt + '</span>'; const d = b.v - a.v; return Math.abs(d) < 0.5 ? '<span class="muted">sem mudança</span>' : '<span class="' + (d > 0 ? 'delta-up' : 'delta-down') + '">' + (d > 0 ? '+' : '−') + brl(Math.abs(d)) + '</span>'; };
  const dCost = (a, b) => { if (!fin(a.v) || !fin(b.v)) return '<span class="muted">antes: ' + a.txt + '</span>'; const d = b.v - a.v; return Math.abs(d) < 0.5 ? '<span class="muted">sem mudança</span>' : '<span class="' + (d < 0 ? 'delta-up' : 'delta-down') + '">' + (d > 0 ? '+' : '−') + brl(Math.abs(d)) + '</span>'; };
  const dData = (a, b) => { if (!fin(a.v) || !fin(b.v)) return '<span class="muted">antes: ' + a.txt + '</span>'; const d = b.v - a.v; return d === 0 ? '<span class="muted">sem mudança</span>' : '<span class="' + (d < 0 ? 'delta-up' : 'delta-down') + '">' + (d > 0 ? duracao(d) + ' depois' : duracao(-d) + ' antes') + '</span>'; };
  const tabela = '<div class="table-wrap"><table><thead><tr><th></th>' + Object.keys(CEN).map(k => '<th class="r">' + CEN[k] + '</th>').join('') + '</tr></thead><tbody>' +
    linha('Saldo no prazo', a => ({ v: a.projetado, txt: brl(a.projetado) }), dMoney) +
    linha('Diferença p/ meta', a => ({ v: a.diferenca, txt: (a.diferenca >= 0 ? '+' : '−') + brl(Math.abs(a.diferenca)) }), dMoney) +
    linha('Aporte necessário', a => ({ v: a.status === 'concluido' ? 0 : a.aporteNecessario, txt: a.status === 'concluido' ? 'R$ 0' : fin(a.aporteNecessario) ? brl(a.aporteNecessario) : 'vencido' }), dCost) +
    linha('Meta atingida em', a => ({ v: a.mesesAteMeta, txt: a.dataEstimada ? mesLabel(a.dataEstimada) : 'não alcança' }), dData) +
    linha('Situação', a => ({ v: 0, txt: pill(a.status) }), null) +
  '</tbody></table></div>';
  // Impacto no orçamento total
  const d = E.diagnostico(V());
  const totalPlan = V().objetivos.filter(x => !x.arquivado).reduce((t, x) => t + (x.id === o.id ? s.aporte : (x.aporte || 0)), 0);
  const capTxt = d.capacidade == null ? 'Cadastre renda e despesas para comparar com sua capacidade.' :
    'Com esta simulação, os aportes de todos os objetivos somam <b>' + brl(totalPlan) + '/mês</b> para uma capacidade de ' + brl(d.capacidade) + (totalPlan > d.capacidade + 0.5 ? ': <b>' + brl(totalPlan - d.capacidade) + ' acima</b>.' : ': cabe no orçamento.');
  const pausaTxt = pausa ? ' Pausa de ' + pausa.meses + (pausa.meses === 1 ? ' mês' : ' meses') + ' a partir do mês ' + pausa.inicio + '; o aporte necessário considera a pausa.' : '';
  return '<section class="card"><div class="card-head"><div><h2>' + esc(o.nome) + '</h2><p>Simulado ' + valoresLabel() + '.' + pausaTxt + '</p></div></div>' +
      lineChart('sim', { n, series, target: { value: s.alvo, label: 'Meta' } }) + '</section>' +
    '<section class="card"><div class="card-head"><div><h2>Antes e depois</h2><p>Valor simulado e a mudança em relação ao plano atual.</p></div></div>' + tabela + '</section>' +
    '<div class="notice ' + (d.capacidade != null && totalPlan > d.capacidade + 0.5 ? 'notice-warn' : 'notice-info') + '">' + ico('info') + '<div>' + capTxt + '</div></div>';
}
function simInput(el) {
  const s = ui.sim, f = el.dataset.sim;
  if (f === 'dataAlvo') s.dataAlvo = el.value;
  else if (f === 'rent' || f === 'infl') { const v = num(el.value) / 100; s.cen[el.dataset.cen][f === 'rent' ? 'rentabilidade' : 'inflacao'] = v; }
  else { const v = num(el.value); s[f] = (f === 'pausaMeses' || f === 'pausaInicio') ? Math.max(f === 'pausaInicio' ? 1 : 0, Math.round(v || 0)) : v; }
  if (f === 'aporte') { const other = el.id === 'sim-aporte' ? $('#sim-aporte-r') : $('#sim-aporte'); if (other) other.value = el.value; }
  $('#simResults').innerHTML = simResultados();
}
const PRESETS = {
  mais200: s => { s.aporte = (s.aporte || 0) + 200; },
  adiar12: s => { s.dataAlvo = E.somarMeses(s.dataAlvo, 12); },
  rentMenos2: s => { Object.values(s.cen).forEach(c => { c.rentabilidade = Math.max(-0.99, c.rentabilidade - 0.02); }); },
  pausa6: s => { s.pausaMeses = 6; s.pausaInicio = 1; },
  inflMais2: s => { Object.values(s.cen).forEach(c => { c.inflacao += 0.02; }); }
};

/* =================== Priorização =================== */
function vPriorizacao() {
  const c = ctx(), p = c.prio, d = c.d;
  const abertos = p.analises.filter(a => a.status !== 'concluido');
  if (!c.ativos.length) return '<div class="page">' + head('Módulo 4', 'Priorização') + '<div class="empty">Crie objetivos para comparar com sua capacidade.<button class="btn btn-primary" data-act="newGoal">' + ico('plus') + 'Criar objetivo</button></div></div>';
  const cores = {}; c.ativos.forEach((o, k) => cores[o.id] = SERIE_CORES[k % SERIE_CORES.length]);
  const totalNec = p.necessarioTotal;
  let barra = '';
  if (d.capacidade != null) {
    const escala = Math.max(totalNec, d.capacidade, 1) * 1.08;
    barra = '<div class="cap-wrap"><div style="position:relative"><div class="cap-bar">' + abertos.filter(a => fin(a.aporteNecessario) && a.aporteNecessario > 0).map(a => '<span style="width:' + (a.aporteNecessario / escala * 100).toFixed(2) + '%;background:' + cores[a.id] + '" title="' + esc(a.nome) + ': ' + brl(a.aporteNecessario) + '"></span>').join('') +
      '</div><div class="cap-mark" style="left:' + Math.min(99.5, d.capacidade / escala * 100).toFixed(2) + '%" data-label="Capacidade ' + brlC(d.capacidade) + '"></div></div>' +
      '<div class="cap-legend">' + abertos.filter(a => fin(a.aporteNecessario) && a.aporteNecessario > 0).map(a => '<span><i style="background:' + cores[a.id] + '"></i>' + esc(a.nome) + ' · ' + brl(a.aporteNecessario) + '</span>').join('') + '</div></div>';
  }
  const tabela = '<div class="table-wrap"><table><thead><tr><th>Objetivo</th><th>Prioridade</th><th class="r">Prazo</th><th class="r">Necessário</th><th class="r">Planejado</th><th>Situação</th></tr></thead><tbody>' +
    p.analises.map(a => { const o = V().objetivos.find(x => x.id === a.id); return '<tr><td><button class="back" style="color:var(--ink)" data-act="openGoal" data-id="' + o.id + '"><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:' + cores[o.id] + '"></i>' + esc(o.nome) + '</button></td>' +
      '<td><div class="prio" role="group" aria-label="Prioridade">' + [1, 2, 3, 4, 5].map(v => '<button data-act="setPrio" data-id="' + o.id + '" data-v="' + v + '" aria-pressed="' + (o.prioridade === v) + '" title="Prioridade ' + v + '">' + v + '</button>').join('') + '</div></td>' +

    const pctRenda = d.rendaTotal ? ' (' + pct(A.aumentar.valor / d.rendaTotal) + ' da renda)' : '';
    alternativas = '<div class="notice notice-warn">' + ico('warn') + '<div>Para cumprir todos os prazos são necessários <b>' + brl(totalNec) + '/mês</b>. Sua capacidade é ' + brl(d.capacidade) + '. Faltam <b>' + brl(p.deficit) + '/mês</b>. Abaixo estão as consequências de cada caminho; você pode aplicar um e depois combinar com outro.</div></div>' +
