        '<button class="btn btn-sm" data-act="aportesNecessarios">Ajustar aportes planejados ao necessário</button><p class="small muted">Isso faz os aportes somarem ' + brl(totalNec) + '/mês, acima da capacidade atual.</p>') +
      altCard(2, 'Adiar um objetivo', 'Quanto cada objetivo precisaria ser adiado para, sozinho, absorver o déficit.',
        tbl([['Objetivo'], ['Nova data', 1], ['Atraso', 1], ['']], A.adiar.map(x => '<tr><td>' + esc(x.nome) + '</td><td class="r">' + (x.suficiente && x.novaData ? mesLabel(x.novaData) : '—') + '</td><td class="r">' + (!x.suficiente ? '<span class="muted">não basta</span>' : fin(x.adiamento) ? duracao(x.adiamento) : 'inalcançável') + '</td><td class="row-actions">' + (x.suficiente && x.novaData ? '<button class="btn btn-sm" data-act="applyPrio" data-tipo="adiar" data-id="' + x.id + '" data-valor="' + x.novaData + '" data-aporte="' + x.aporte + '">Aplicar</button>' : '') + '</td></tr>').join(''))) +
      altCard(3, 'Reduzir uma meta', 'Quanto cada meta precisaria diminuir, mantendo o prazo, para absorver o déficit.',
        tbl([['Objetivo'], ['Nova meta', 1], ['Redução', 1], ['']], A.reduzir.map(x => '<tr><td>' + esc(x.nome) + '</td><td class="r">' + (x.suficiente ? brl(x.novaMeta) : '—') + '</td><td class="r">' + (x.suficiente ? '−' + pct(x.reducaoPct, 0) : '<span class="muted">não basta</span>') + '</td><td class="row-actions">' + (x.suficiente ? '<button class="btn btn-sm" data-act="applyPrio" data-tipo="reduzir" data-id="' + x.id + '" data-valor="' + Math.floor(x.novaMeta) + '" data-aporte="' + x.aporte + '">Aplicar</button>' : '') + '</td></tr>').join(''))) +
      altCard(4, 'Distribuir pela sua prioridade', 'A capacidade vai primeiro para a prioridade 1, depois 2, e assim por diante. Empates: prazo mais curto primeiro.', distTabela(A.porPrioridade, 'prioridade'), true) +
      altCard(5, 'Distribuir proporcionalmente', 'Todos recebem a mesma fração do que precisam (' + pct(Math.min(1, d.capacidade / totalNec), 0) + ').', distTabela(A.proporcional, 'proporcional'), true) +
      '</div>';
  } else {
    alternativas = '<div class="notice notice-ok">' + ico('check') + '<div>Os aportes necessários (' + brl(totalNec) + '/mês) cabem na sua capacidade. Sobram <b>' + brl(p.folga) + '/mês</b>.' + (p.planejadoTotal > d.capacidade + 0.5 ? ' Porém seus aportes planejados (' + brl(p.planejadoTotal) + ') passam da capacidade.' : '') + '</div></div>' +
      (Math.abs(p.planejadoTotal - totalNec) > 1 ? '<div class="btn-row"><button class="btn btn-sm" data-act="aportesNecessarios">Ajustar aportes planejados ao necessário (' + brl(totalNec) + ')</button></div>' : '');
  }
  return '<div class="page">' + demoBanner() + head('Módulo 4', 'Priorização', 'Quando nem tudo cabe no orçamento, compare as consequências de cada escolha. Cálculos no cenário base, ' + valoresLabel() + '.') +
    '<div class="grid g4">' +
      stat('Capacidade de aporte', brl(d.capacidade), 'Por mês', d.capacidade == null ? 'Falta cadastrar' : null) +
      stat('Necessário para todos os prazos', brl(totalNec), abertos.length + ' objetivos em andamento') +
      stat('Planejado hoje', brl(p.planejadoTotal), 'Soma dos aportes planejados') +
      (p.deficit == null ? stat('Déficit', '', '', 'Sem capacidade') : p.deficit > 0.5 ? stat('Déficit mensal', '<span style="color:var(--bad)">' + brl(p.deficit) + '</span>', 'Necessário − capacidade') : stat('Folga mensal', '<span style="color:var(--ok)">' + brl(p.folga) + '</span>', 'Capacidade − necessário')) +
    '</div>' +
    (p.vencidos.length ? '<div class="notice notice-bad">' + ico('warn') + '<div>Com prazo vencido e meta não atingida: ' + p.vencidos.map(a => '<b>' + esc(a.nome) + '</b>').join(', ') + '. Defina uma nova data para incluí-los na conta.</div></div>' : '') +
    '<section class="card"><div class="card-head"><div><h2>Necessidade x capacidade</h2><p>Cada faixa é o aporte que um objetivo exige para cumprir o prazo.</p></div></div>' + (barra || '<div class="empty">Sem capacidade cadastrada.</div>') + '</section>' +
    '<section class="card"><div class="card-head"><div><h2>Seus objetivos</h2></div></div>' + tabela + '</section>' +
    alternativas +
    (d.capacidade != null ? '<section class="card"><div class="card-head"><div><h2>E se minha renda mudar?</h2><p>Variação aplicada sobre a renda total; despesas mantidas.</p></div></div>' +
      '<div class="grid g2" style="align-items:center"><div class="field"><label for="rendaDelta">Variação da renda: <b id="rendaDeltaLbl">' + (ui.rendaDelta >= 0 ? '+' : '') + pct(ui.rendaDelta, 0) + '</b></label><input type="range" id="rendaDelta" min="-30" max="50" step="1" value="' + Math.round(ui.rendaDelta * 100) + '" data-input="rendaDelta"></div><div id="rendaWhatIf">' + rendaWhatIf(c) + '</div></div></section>' : '') +
  '</div>';
}
function distTabela(lista, modo) {
  return '<div class="table-wrap"><table><thead><tr><th>Objetivo</th><th class="r">Aporte</th><th class="r">Da meta no prazo</th><th class="r">Meta atingida em</th></tr></thead><tbody>' +
    lista.map(x => '<tr><td>' + esc(x.nome) + '</td><td class="r">' + brl(x.aporte) + '</td><td class="r">' + pct(Math.min(9.99, x.cobertura), 0) + '</td><td class="r">' + (x.novaData ? mesLabel(x.novaData) + (x.atraso > 0 ? '<div class="small delta-down">' + duracao(x.atraso) + ' depois</div>' : '') : 'não alcança') + '</td></tr>').join('') +
    '</tbody></table></div><div class="btn-row"><button class="btn btn-sm" data-act="applyDist" data-modo="' + modo + '">Aplicar estes aportes</button></div>';
}
function rendaWhatIf(c) {
  const d = c.d, p = c.prio;
  if (d.capacidadeManual) return '<p class="small muted">Sua capacidade está definida manualmente (' + brl(d.capacidade) + '); a variação de renda não a altera.</p>';
  const nova = d.capacidade + ui.rendaDelta * (d.rendaTotal || 0);
  const saldo = nova - p.necessarioTotal;
  return '<div class="kv"><div><span>Nova capacidade</span><b>' + brl(nova) + '/mês</b></div><div><span>' + (saldo >= 0 ? 'Folga' : 'Déficit') + '</span><b style="color:' + (saldo >= 0 ? 'var(--ok)' : 'var(--bad)') + '">' + brl(Math.abs(saldo)) + '/mês</b></div></div>';
}

/* =================== Assistente =================== */
const PERGUNTAS = [
  ['distante', 'Qual objetivo está mais distante do planejado?'],
  ['mais15', 'O que acontece se eu aumentar meus aportes em 15%?'],
  ['otimista', 'Minhas premissas de rentabilidade são otimistas demais?'],
  ['revisar', 'Quais informações preciso revisar?'],
  ['carro', 'Posso comprar um carro de R$ 70 mil sem comprometer a meta do imóvel?']
];
function vAssistente() {
  const permitido = S.config.iaPermitida && ui.iaDisponivel;
  const msgs = ui.chat.length ? ui.chat.map(m => '<div class="msg ' + (m.role === 'user' ? 'msg-user' : 'msg-ai') + '">' + (m.role === 'user' ? esc(m.text) : md(m.text)) + (m.meta ? '<div class="msg-meta">' + esc(m.meta) + '</div>' : '') + '</div>').join('') :
    '<div class="msg msg-ai"><p>Olá. Eu explico os resultados do seu planejamento usando os números que o Atlas calcula. Não faço contas por conta própria, não prometo rentabilidade e não mudo nada no plano.</p><p>Escolha uma pergunta abaixo ou escreva a sua.</p></div>';
  return '<div class="page">' + head('Módulo 5', 'Assistente', 'Perguntas em linguagem natural sobre o seu plano. As respostas usam os cálculos do Atlas e mostram as premissas.') +
    (ui.iaDisponivel ? '<div class="notice ' + (permitido ? 'notice-info' : 'notice-warn') + '">' + ico(permitido ? 'info' : 'warn') + '<div style="flex:1">' +
      (permitido ? 'Perguntas abertas enviam um resumo do seu planejamento ao Claude para gerar a resposta. ' : '<b>Modo local.</b> As perguntas rápidas são respondidas aqui mesmo, só com os cálculos do Atlas. Para perguntas abertas, permita o envio do resumo do seu planejamento à IA. ') +
      '<div style="margin-top:8px"><label class="switch"><input type="checkbox" data-act="toggleIA"' + (S.config.iaPermitida ? ' checked' : '') + '>Permitir que o assistente use IA com meus dados</label></div></div></div>'
      : '<div class="notice notice-info">' + ico('info') + '<div>As respostas são calculadas aqui mesmo, com os números do Atlas e do painel. Nada é enviado a serviços de IA.</div></div>') +
    '<section class="card chat"><div class="chat-log" id="chatLog" aria-live="polite">' + msgs + (ui.aiBusy ? '<div class="msg msg-ai" id="aiPending"><span class="typing"><i></i><i></i><i></i></span></div>' : '') + '</div>' +
      '<div><div class="chips" style="padding:12px 12px 0">' + PERGUNTAS.map(([k, q]) => '<button class="chip" data-act="ask" data-k="' + k + '"' + (ui.aiBusy ? ' disabled' : '') + '>' + q + '</button>').join('') + '</div>' +
      (ui.iaDisponivel ? '<form class="chat-input" data-form="chat"><textarea class="input" id="chatText" rows="1" placeholder="' + (permitido ? 'Pergunte sobre seu planejamento…' : 'Ative a IA acima para perguntas abertas') + '"' + (permitido ? '' : ' disabled') + '></textarea><button class="btn btn-primary" type="submit" aria-label="Enviar"' + (permitido && !ui.aiBusy ? '' : ' disabled') + '>' + ico('send') + '</button></form>' : '<div style="height:12px"></div>') + '</div>' +
    '</section></div>';
}
function md(t) {
  const linhas = esc(t).split('\n');
  let out = '', lista = false;
  const inl = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])\*(?!\s)(.+?)\*(?=[\s).,;:!?]|$)/g, '$1<i>$2</i>');
  linhas.forEach(l => {
    const m = /^\s*[-•*]\s+(.*)$/.exec(l);
    if (m) { if (!lista) { out += '<ul>'; lista = true; } out += '<li>' + inl(m[1]) + '</li>'; return; }
    if (lista) { out += '</ul>'; lista = false; }
    if (/^#{1,4}\s/.test(l)) { out += '<p><b>' + inl(l.replace(/^#+\s/, '')) + '</b></p>'; return; }
    if (l.trim()) out += '<p>' + inl(l) + '</p>';
  });
  if (lista) out += '</ul>';
  return out;
}

/* Respostas locais: só fatos calculados pelo motor */
function respostaLocal(k) {
  const c = ctx(), abertos = c.base.filter(x => x.a.status !== 'concluido');
  if (k === 'distante') {
    if (!abertos.length) return 'Você não tem objetivos em andamento.';
    const pior = [...abertos].sort((x, y) => x.a.cobertura - y.a.cobertura)[0];
    const a = pior.a;
    return '**' + pior.o.nome + '** é o objetivo mais distante do planejado. No cenário base, o aporte atual de ' + brl(pior.o.aporte) + '/mês leva a ' + brl(a.projetado) + ' em ' + mesLabel(pior.o.dataAlvo) + ', ou ' + pct(a.cobertura, 0) + ' da meta de ' + brl(a.alvo) + '.\n' +
      (fin(a.aporteNecessario) ? '- Para cumprir o prazo seriam necessários ' + brl(a.aporteNecessario) + '/mês.\n' : '- A data-alvo já passou.\n') +
      (a.dataEstimada ? '- Mantendo o aporte, a meta chega em ' + mesLabel(a.dataEstimada) + '.\n' : '- Mantendo o aporte, a meta não é alcançada.\n') +
      'Premissas: rentabilidade de ' + pct(a.premissas.rentabilidadeAnual) + ' a.a.' + (S.config.considerarInflacao ? ' e inflação de ' + pct(a.premissas.inflacaoAnual) + ' a.a., valores de hoje.' : ', valores nominais.');
  }
  if (k === 'mais15') {
    if (!abertos.length) return 'Você não tem objetivos em andamento.';
    let t = 'Aumentando cada aporte em 15% (cenário base):\n';
    let total = 0;
    abertos.forEach(({ o, a }) => {
      const b = analisar(o, 'base', { aporteDelta: (o.aporte || 0) * 0.15 });
      total += (o.aporte || 0) * 1.15;
      t += '- **' + o.nome + '**: ' + brl(o.aporte) + ' → ' + brl(o.aporte * 1.15) + '/mês. ' + STATUS[a.status] + ' → ' + STATUS[b.status] + '; ' + (b.dataEstimada ? 'meta em ' + mesLabel(b.dataEstimada) + (a.dataEstimada && b.mesesAteMeta < a.mesesAteMeta ? ' (' + duracao(a.mesesAteMeta - b.mesesAteMeta) + ' antes)' : '') : 'ainda não alcança') + '.\n';
    });
    const capac = c.d.capacidade;
    t += capac != null ? 'Os aportes somariam ' + brl(total) + '/mês para uma capacidade de ' + brl(capac) + (total > capac ? ', ou seja, ' + brl(total - capac) + ' acima do que sobra hoje.' : ', dentro do orçamento.') : 'Cadastre renda e despesas para saber se esse aumento cabe no orçamento.';
    return t;
  }
  if (k === 'otimista') {
    const cen = S.config.cenarios, out = [];
    Object.keys(CEN).forEach(n => { const p = E.premissas(cen[n], true); out.push('- **' + CEN[n] + '**: ' + pct(cen[n].rentabilidade) + ' a.a. com inflação de ' + pct(cen[n].inflacao) + ' = ' + pct(p.taxaAnualUsada, 2) + ' real ao ano.'); });
    const realBase = E.premissas(cen.base, true).taxaAnualUsada, realOt = E.premissas(cen.otimista, true).taxaAnualUsada;
    let aval = [];
    if (realBase > 0.06) aval.push('O cenário base supõe ganho real acima de 6% ao ano por todo o prazo. Isso é exigente e costuma depender de mais risco; compare com o que seus investimentos rendem de fato, já descontados impostos e taxas.');
    if (realOt > 0.09) aval.push('O cenário otimista supõe ganho real acima de 9% ao ano, o que dificilmente deve servir de referência para metas com prazo rígido.');
    if (cen.conservador.rentabilidade >= cen.base.rentabilidade) aval.push('O cenário conservador não está abaixo do base; ele perde a função de teste de estresse.');
    if (!S.config.considerarInflacao) aval.push('A inflação está desligada: os resultados estão em valores nominais e superestimam o poder de compra futuro.');
    const sens = c.base.filter(x => x.a.status !== 'concluido').map(({ o }) => ({ o, b: analisar(o, 'base').status, c: analisar(o, 'conservador').status })).filter(x => x.b !== x.c && x.c !== 'no_caminho');
    if (sens.length) aval.push('Objetivos que saem do caminho no cenário conservador: ' + sens.map(x => x.o.nome).join(', ') + '. Eles dependem da rentabilidade mais alta.');
    return 'Suas premissas atuais:\n' + out.join('\n') + '\n\n' + (aval.length ? aval.join('\n\n') : 'As premissas não chamam atenção pelos critérios do Atlas (ganho real até 6% a.a. no base e conservador abaixo do base). Ainda assim, são hipóteses, não garantias.');
  }
  if (k === 'revisar') {
    const d = c.d, out = [...d.pendencias];
    if (d.rendaVariavel > 0) out.push('Parte da renda (' + brl(d.rendaVariavel) + '/mês) é variável. A capacidade num mês típico garantido é ' + brl(d.capacidadeRecorrente) + '.');
    if (d.mesesReserva != null && d.mesesReserva < 3) out.push('A reserva cobre ' + d.mesesReserva.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' meses de despesas.');
    d.alertas.forEach(a => out.push(a));
    c.base.forEach(({ o, a }) => { if (a.prazoVencido) out.push('A data-alvo de "' + o.nome + '" já passou.'); if (!o.aporte && a.status !== 'concluido') out.push('"' + o.nome + '" não tem aporte planejado.'); });
    if (S.exemplo) out.unshift('Você está usando dados de exemplo. Substitua-os pelos seus para obter conclusões reais.');
    return out.length ? 'Pontos para revisar:\n' + out.map(x => '- ' + x).join('\n') : 'Não encontrei lacunas nos dados cadastrados. Revise as premissas de rentabilidade e inflação pelo menos uma vez por ano.';
  }
  if (k === 'carro') {
    const d = c.d, valor = 70000, livre = d.livreParaObjetivos;
    const imovel = c.base.find(x => x.o.categoria === 'imovel' && x.a.status !== 'concluido');
    let t = 'Para um carro de **R$ 70.000** (cenário base, ' + valoresLabel() + '):\n';
    if (livre >= valor) t += '- **À vista agora:** seu dinheiro livre, fora dos objetivos, é ' + brl(livre) + '. A compra cabe nele sem tocar nas metas e sobram ' + brl(livre - valor) + '.\n';
    else {
      const falta = valor - Math.max(0, livre);
      t += '- **À vista agora:** o dinheiro livre (' + brl(Math.max(0, livre)) + ') não basta. Faltariam ' + brl(falta) + ', que sairiam das reservas dos objetivos.';
      if (imovel) { const a2 = analisar(Object.assign({}, imovel.o, { acumulado: Math.max(0, imovel.o.acumulado - falta) }), 'base'); t += ' Se saírem da reserva de "' + imovel.o.nome + '", o aporte necessário para manter o prazo passa de ' + brl(imovel.a.aporteNecessario) + ' para ' + brl(a2.aporteNecessario) + '/mês.'; }
      t += '\n';
    }
    const novo = { id: 'novo', nome: 'Carro', alvo: valor, acumulado: 0, dataAlvo: E.somarMeses(hoje(), 24), aporte: 0, prioridade: 3 };
    const an = analisar(novo, 'base');
    const p2 = E.priorizar(V().objetivos.concat([novo]), d.capacidade, S.config.cenarios.base, S.config.considerarInflacao, hoje());
    t += '- **Juntando por 24 meses:** seriam ' + brl(an.aporteNecessario) + '/mês. ' + (d.capacidade == null ? 'Sem renda e despesas não dá para comparar com sua capacidade.' : p2.deficit > 0.5 ? 'Somado aos outros objetivos, faltariam ' + brl(p2.deficit) + '/mês na sua capacidade de ' + brl(d.capacidade) + '.' : 'Cabe na sua capacidade, com folga de ' + brl(p2.folga) + '/mês.') + '\n';
    t += imovel ? 'Hoje "' + imovel.o.nome + '" está como ' + STATUS[imovel.a.status].toLowerCase() + '.' : 'Você não tem um objetivo de imóvel em andamento.';
    return t;
  }
  return 'Não sei responder isso no modo local.';
}

function resumoParaIA() {
  const c = ctx(), d = c.d, cfg = S.config;
  const r2 = v => fin(v) ? Math.round(v * 100) / 100 : v;
  return {
    referencia: hoje(), valores: cfg.considerarInflacao ? 'reais (poder de compra de hoje); aportes corrigidos pela inflação' : 'nominais, sem inflação',

async function perguntar(texto, chave) {
  ui.chat.push({ role: 'user', text: texto });
  if (!S.config.iaPermitida || !ui.iaDisponivel) {
    ui.chat.push({ role: 'ai', text: respostaLocal(chave || ''), meta: 'Resposta calculada localmente pelo Atlas' });
    render(); return;
  }
  ui.aiBusy = true; render();
  const sample = await cap('sample');
  if (!sample) {
    ui.aiBusy = false;
    ui.chat.push({ role: 'ai', text: chave ? respostaLocal(chave) : 'A IA não está disponível nesta forma de abrir o Atlas (por exemplo, como arquivo no computador). As perguntas rápidas continuam funcionando com os cálculos locais.', meta: chave ? 'Resposta calculada localmente pelo Atlas' : '' });
    render(); return;
  }
  const instrucoes = 'Você é o assistente do Atlas, um planejador financeiro pessoal. Responda em português do Brasil, em até 200 palavras, com frases diretas.\n' +
    'Regras obrigatórias:\n- Use apenas números obtidos pelas ferramentas. Nunca calcule valores financeiros por conta própria; para qualquer hipótese, chame a ferramenta que recalcula.\n' +
    '- Mostre as premissas usadas (cenário, rentabilidade, inflação) e diga que projeções não são garantias.\n- Não recomende produtos financeiros específicos. Não altere o plano: sugira o que o usuário pode mudar na tela adequada.\n' +
    '- Se faltar informação, diga qual. Formate valores como R$ 1.234 e datas como mês/ano. A data de referência (hoje) é ' + mesLongo(hoje()) + '.';
  const hist = [];
  ui.chat.slice(0, -1).filter(m => m.text).slice(-6).forEach(m => {
    const role = m.role === 'user' ? 'user' : 'assistant';
    if (hist.length && hist[hist.length - 1].role === role) hist[hist.length - 1].content += '\n\n' + m.text;
    else hist.push({ role, content: m.text });
  });
  while (hist.length && hist[0].role !== 'user') hist.shift();
  if (hist.length && hist[hist.length - 1].role === 'user') hist.pop();
  hist.push({ role: 'user', content: instrucoes + '\n\nPergunta: ' + texto });
  const msg = { role: 'ai', text: '', meta: 'Claude · números calculados pelo Atlas' };
  try {
    const r = await sample(hist, { tools: FERRAMENTAS, cache: false, onText: u => { msg.text = u.text; const el = $('#aiPending'); if (el && u.text) el.innerHTML = md(u.text); } });
    msg.text = r.text || 'Sem resposta.';
  } catch (e) {
    msg.text = e && e.code === 'not_granted' ? 'O acesso à IA não foi autorizado. As perguntas rápidas continuam funcionando no modo local.' : e && e.code === 'rate_limited' ? 'Muitas perguntas em pouco tempo. Aguarde um instante e tente de novo.' : 'Não consegui obter resposta da IA agora.' + (chave ? '\n\n' + respostaLocal(chave) : '');
    msg.meta = chave ? 'Resposta calculada localmente pelo Atlas' : '';
  }
  ui.aiBusy = false; ui.chat.push(msg); render();
}

function formGoal(id) {
  const o = id ? S.objetivos.find(x => x.id === id) : { categoria: 'outro', prioridade: 3, flex: 'moderado', acumulado: 0, aporte: 0, dataAlvo: E.somarMeses(hoje(), 24), vinculos: [] };
  const segP = [1, 2, 3, 4, 5].map(v => '<button type="button" data-act="formPrio" data-v="' + v + '" aria-pressed="' + (o.prioridade === v) + '">' + v + '</button>').join('');
  const segF = Object.entries(FLEX).map(([k, l]) => '<button type="button" data-act="formFlex" data-v="' + k + '" aria-pressed="' + (o.flex === k) + '">' + l.replace('Prazo ', '') + '</button>').join('');
  const d = E.diagnostico(V());
  const fontes = usandoPainel() ? fontesPainel().filter(f => ['investimento', 'reserva', 'conta'].includes(f.tipoAtlas)) : [];
  const vinc = o.vinculos || [];
  const modo = vinc.length && fontes.length ? 'painel' : 'manual';
  const efetivoO = id ? V().objetivos.find(x => x.id === id) : null;
  const livre = d.livreParaObjetivos + (efetivoO ? (efetivoO.acumulado || 0) : 0);
  const blocoReserva = fontes.length ?
    '<div class="field full"><span class="label">Valor já reservado</span><div class="seg" id="g-modo" data-v="' + modo + '"><button type="button" data-act="formModo" data-v="manual" aria-pressed="' + (modo === 'manual') + '">Informar valor</button><button type="button" data-act="formModo" data-v="painel" aria-pressed="' + (modo === 'painel') + '">Usar saldos do painel</button></div></div>' +
    '<div class="full" id="g-manual"' + (modo === 'painel' ? ' hidden' : '') + '>' + campo('g-acum', 'Quanto já está separado', inpMoney('g-acum', o.acumulado), 'Livre no patrimônio financeiro: ' + brl(livre)) + '</div>' +
    '<div class="full stack" id="g-painel" style="gap:8px"' + (modo === 'manual' ? ' hidden' : '') + '>' +
      fontes.map((f, k) => { const v = vinc.find(x => x.key === f.key); return '<div class="vinc"><label class="vinc-chk"><input type="checkbox" data-vk="' + esc(f.key) + '"' + (v ? ' checked' : '') + '><span><b>' + esc(f.nome) + '</b><small>' + TIPO_FONTE[f.tipoAtlas] + ' · ' + brl(f.saldo) + '</small></span></label><div class="input-suf vinc-pct"><input class="input" type="number" min="1" max="100" step="1" id="g-vp-' + k + '" data-vpct="' + esc(f.key) + '" value="' + (v ? v.pct : 100) + '" aria-label="Porcentagem de ' + esc(f.nome) + '"><span>%</span></div></div>'; }).join('') +
      '<span class="hint">O valor reservado acompanha o saldo do painel sozinho. Use menos de 100% quando um saldo financia mais de um objetivo.</span></div>'
    : campo('g-acum', 'Já reservado para ela', inpMoney('g-acum', o.acumulado), 'Livre no patrimônio financeiro: ' + brl(livre));
  abrirModal('<div class="modal-head"><h2>' + (id ? 'Editar objetivo' : 'Novo objetivo') + '</h2><button class="icon-btn" data-act="closeModal" aria-label="Fechar">' + ico('x') + '</button></div>' +
    '<form data-form="modal" class="stack" style="gap:16px" novalidate><div class="form-grid">' +
      campo('g-nome', 'Nome', '<input class="input" id="g-nome" maxlength="80" value="' + esc(o.nome || '') + '" placeholder="Ex.: Trocar de carro">', '', true) +
      campo('g-cat', 'Categoria', '<select class="input" id="g-cat">' + Object.entries(CATS).map(([k, l]) => '<option value="' + k + '"' + (o.categoria === k ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>') +
      campo('g-data', 'Data-alvo', '<input class="input" type="month" id="g-data" value="' + esc(o.dataAlvo || '') + '" min="' + E.somarMeses(hoje(), 1) + '">') +
      campo('g-alvo', 'Valor da meta', inpMoney('g-alvo', o.alvo), S.config.considerarInflacao ? 'Em valores de hoje; o Atlas corrige pela inflação' : 'Valor nominal') +
      campo('g-aporte', 'Aporte mensal planejado', inpMoney('g-aporte', o.aporte)) +
      blocoReserva +
      '<div class="field"><span class="label">Prioridade (1 = mais alta)</span><div class="prio" id="g-prio" data-v="' + o.prioridade + '">' + segP + '</div></div>' +
      '<div class="field"><span class="label">Flexibilidade do prazo</span><div class="seg" id="g-flex" data-v="' + o.flex + '">' + segF + '</div></div>' +
      campo('g-desc', 'Descrição (opcional)', '<textarea class="input" id="g-desc" rows="2" maxlength="300">' + esc(o.descricao || '') + '</textarea>', '', true) +
    '</div><div id="formErr" class="err"></div><div class="modal-foot"><button type="button" class="btn" data-act="closeModal">Cancelar</button><button type="submit" class="btn btn-primary">' + (id ? 'Salvar' : 'Criar objetivo') + '</button></div></form>', () => {
      const v = { nome: $('#g-nome').value.trim(), categoria: $('#g-cat').value, dataAlvo: $('#g-data').value, alvo: num($('#g-alvo').value), aporte: num($('#g-aporte').value) || 0, prioridade: +$('#g-prio').dataset.v, flex: $('#g-flex').dataset.v, descricao: $('#g-desc').value.trim() };
      const modoEsc = $('#g-modo') ? $('#g-modo').dataset.v : 'manual';
      if (!v.nome) return erroForm('Dê um nome ao objetivo.');
      if (!fin(v.alvo) || v.alvo <= 0) return erroForm('Informe o valor da meta.');
      if (v.aporte < 0) return erroForm('O aporte não pode ser negativo.');
      try { E.lerMes(v.dataAlvo); } catch (e) { return erroForm('Escolha a data-alvo (mês e ano).'); }
      if (!id && E.mesesEntre(hoje(), v.dataAlvo) <= 0) return erroForm('A data-alvo precisa estar no futuro.');
      if (modoEsc === 'painel') {
        v.vinculos = $$('[data-vk]').filter(c => c.checked).map(c => ({ key: c.dataset.vk, pct: num($$('[data-vpct]').find(i => i.dataset.vpct === c.dataset.vk).value) }));
        if (!v.vinculos.length) return erroForm('Escolha ao menos um saldo do painel.');
        if (v.vinculos.some(x => !fin(x.pct) || x.pct <= 0 || x.pct > 100)) return erroForm('Use porcentagens entre 1% e 100%.');
      } else {
        v.vinculos = []; v.acumulado = num($('#g-acum').value) || 0;
        if (v.acumulado < 0) return erroForm('O valor reservado não pode ser negativo.');
      }
      let novoId_;
      commit(s => { if (id) Object.assign(s.objetivos.find(x => x.id === id), v); else { novoId_ = novoId(); s.objetivos.push(Object.assign({ id: novoId_, arquivado: false, acumulado: 0 }, v)); } }, id ? 'Objetivo atualizado' : 'Objetivo criado');
      if (novoId_) go('objetivo', novoId_);
      return true;
    });
}

/* =================== Ações =================== */
const CAMPO_LABEL = { aporte: 'aporte mensal', dataAlvo: 'data-alvo', alvo: 'meta' };
const fmtCampo = (c, v) => c === 'dataAlvo' ? mesLongo(v) : brl(+v);
const ACT = {
  go: el => go(el.dataset.view),
  openGoal: el => go('objetivo', el.dataset.id),
  newGoal: () => formGoal(),
  editGoal: el => formGoal(el.dataset.id),
  simGoal: el => { const o = V().objetivos.find(x => x.id === el.dataset.id); ui.sim = simDe(o); go('simulacoes'); },
  archiveGoal: el => { const o = S.objetivos.find(x => x.id === el.dataset.id); commit(() => { o.arquivado = !o.arquivado; }, o.arquivado ? 'Objetivo arquivado' : 'Objetivo reativado'); },
  delGoal: el => { const o = S.objetivos.find(x => x.id === el.dataset.id); confirmar({ titulo: 'Excluir “' + esc(o.nome) + '”?', corpo: '<p>O objetivo e seu histórico de premissas serão removidos. Se quiser só tirá-lo das contas, arquive.</p>', ok: 'Excluir', perigo: true, acao: () => { commit(s => { s.objetivos = s.objetivos.filter(x => x.id !== o.id); }, 'Objetivo excluído'); go('objetivos'); } }); },
  arquivados: el => { ui.arquivados = el.dataset.v === '1'; render(); },
  modo: el => { ui.modo = el.dataset.v; render(); },
  applyGoal: el => {
    const o = S.objetivos.find(x => x.id === el.dataset.id), c = el.dataset.campo, v = el.dataset.valor;
    confirmar({ titulo: 'Atualizar o plano?', corpo: '<p><b>' + esc(o.nome) + '</b>: ' + CAMPO_LABEL[c] + ' de ' + fmtCampo(c, o[c]) + ' para <b>' + fmtCampo(c, v) + '</b>.</p>', ok: 'Aplicar',
      acao: () => commit(() => { o[c] = c === 'dataAlvo' ? v : +v; }, 'Plano atualizado') });
  },
  addItem: el => formItem(el.dataset.tipo),
  editItem: el => formItem(el.dataset.tipo, el.dataset.id),
  delItem: el => { const t = el.dataset.tipo, x = S[t].find(i => i.id === el.dataset.id); confirmar({ titulo: 'Excluir “' + esc(x.nome) + '”?', corpo: '<p>Os indicadores serão recalculados sem este item.</p>', ok: 'Excluir', perigo: true, acao: () => commit(s => { s[t] = s[t].filter(i => i.id !== x.id); }, 'Item excluído') }); },
  toggleCapManual: el => { const d = E.diagnostico(V()); commit(s => { s.config.capacidadeManual = el.checked ? Math.max(0, Math.round(d.capacidadeCalculada || 0)) : null; }); },
  setPrio: el => commit(s => { s.objetivos.find(x => x.id === el.dataset.id).prioridade = +el.dataset.v; }),
  formPrio: el => { const g = el.parentNode; g.dataset.v = el.dataset.v; $$('button', g).forEach(b => b.setAttribute('aria-pressed', b === el)); },
  formFlex: el => { const g = el.parentNode; g.dataset.v = el.dataset.v; $$('button', g).forEach(b => b.setAttribute('aria-pressed', b === el)); },
  preset: el => { PRESETS[el.dataset.k](ui.sim); render(); },
  simReset: () => { const o = V().objetivos.find(x => x.id === ui.sim.goalId); ui.sim = simDe(o); render(); },
  simApply: () => {
    const s = ui.sim, o = V().objetivos.find(x => x.id === s.goalId), mud = [];
    try { E.lerMes(s.dataAlvo); } catch (e) { toast('Data-alvo inválida'); return; }
    if (s.aporte !== o.aporte) mud.push(['aporte', 'Aporte mensal', brl(o.aporte), brl(s.aporte)]);
    if (s.dataAlvo !== o.dataAlvo) mud.push(['dataAlvo', 'Data-alvo', mesLabel(o.dataAlvo), mesLabel(s.dataAlvo)]);
    if (s.saldo !== o.acumulado && !o.vinculado) mud.push(['acumulado', 'Saldo reservado', brl(o.acumulado), brl(s.saldo)]);
    if (s.alvo !== o.alvo) mud.push(['alvo', 'Meta', brl(o.alvo), brl(s.alvo)]);
    const premMudou = JSON.stringify(s.cen) !== JSON.stringify(S.config.cenarios);
    if (!mud.length && !premMudou && !(o.vinculado && s.saldo !== o.acumulado)) { toast('A simulação é igual ao plano atual'); return; }
    confirmar({ titulo: 'Aplicar ao plano?', ok: 'Aplicar',
      corpo: (mud.length ? '<p><b>' + esc(o.nome) + '</b></p><ul style="margin:0;padding-left:18px">' + mud.map(m => '<li>' + m[1] + ': ' + m[2] + ' → <b>' + m[3] + '</b></li>').join('') + '</ul>' : '') +
        (premMudou ? '<label class="switch" style="margin-top:6px"><input type="checkbox" id="aplPrem">Aplicar também as premissas dos cenários a todos os objetivos</label>' : '') +
        (s.pausaMeses > 0 ? '<p class="muted">A pausa de aportes é só uma simulação e não é gravada.</p>' : '') + (o.vinculado && s.saldo !== o.acumulado ? '<p class="muted">O saldo reservado vem do painel e não é alterado.</p>' : ''),
      acao: () => { const prem = $('#aplPrem') && $('#aplPrem').checked; commit(st => { const g = st.objetivos.find(x => x.id === o.id); g.aporte = s.aporte; g.dataAlvo = s.dataAlvo; if (!o.vinculado) g.acumulado = s.saldo; g.alvo = s.alvo; if (prem) st.config.cenarios = JSON.parse(JSON.stringify(s.cen)); }, 'Plano atualizado'); } });
  },
  applyPrio: el => {
    const o = S.objetivos.find(x => x.id === el.dataset.id), adiar = el.dataset.tipo === 'adiar', ap = Math.ceil(+el.dataset.aporte);
    confirmar({ titulo: adiar ? 'Adiar este objetivo?' : 'Reduzir esta meta?', ok: 'Aplicar',
      corpo: '<p><b>' + esc(o.nome) + '</b></p><ul style="margin:0;padding-left:18px">' + (adiar ? '<li>Data-alvo: ' + mesLabel(o.dataAlvo) + ' → <b>' + mesLabel(el.dataset.valor) + '</b></li>' : '<li>Meta: ' + brl(o.alvo) + ' → <b>' + brl(+el.dataset.valor) + '</b></li>') + '<li>Aporte planejado: ' + brl(o.aporte) + ' → <b>' + brl(ap) + '</b></li></ul><p class="muted">Os demais objetivos terão o aporte ajustado ao necessário.</p>',
      acao: () => commit(s => {
        const g = s.objetivos.find(x => x.id === o.id); if (adiar) g.dataAlvo = el.dataset.valor; else g.alvo = +el.dataset.valor;
        s.objetivos.filter(x => !x.arquivado).forEach(x => { if (x.id === o.id) { x.aporte = ap; return; } const a = analisar(V().objetivos.find(y => y.id === x.id) || x, 'base'); if (fin(a.aporteNecessario)) x.aporte = Math.ceil(a.aporteNecessario); });
      }, 'Plano atualizado') });
  },
  applyDist: el => {
    const c = ctx(), lista = el.dataset.modo === 'prioridade' ? c.prio.alternativas.porPrioridade : c.prio.alternativas.proporcional;
    confirmar({ titulo: 'Aplicar esta distribuição?', ok: 'Aplicar', corpo: '<ul style="margin:0;padding-left:18px">' + lista.map(x => '<li>' + esc(x.nome) + ': ' + brl((S.objetivos.find(o => o.id === x.id) || {}).aporte) + ' → <b>' + brl(Math.floor(x.aporte)) + '</b></li>').join('') + '</ul><p class="muted">Os prazos e metas continuam os mesmos; objetivos com aporte menor que o necessário ficarão abaixo do planejado.</p>',
      acao: () => commit(s => { lista.forEach(x => { const o = s.objetivos.find(y => y.id === x.id); if (o) o.aporte = Math.floor(x.aporte); }); }, 'Aportes atualizados') });
  },
  aportesNecessarios: () => {
    const c = ctx(), lista = c.base.filter(x => x.a.status !== 'concluido' && fin(x.a.aporteNecessario));
    confirmar({ titulo: 'Ajustar aportes ao necessário?', ok: 'Aplicar', corpo: '<ul style="margin:0;padding-left:18px">' + lista.map(({ o, a }) => '<li>' + esc(o.nome) + ': ' + brl(o.aporte) + ' → <b>' + brl(Math.ceil(a.aporteNecessario)) + '</b></li>').join('') + '</ul>',
      acao: () => commit(s => { lista.forEach(({ o, a }) => { s.objetivos.find(x => x.id === o.id).aporte = Math.ceil(a.aporteNecessario); }); }, 'Aportes atualizados') });
  },
  toggleIA: el => { commit(s => { s.config.iaPermitida = el.checked; }, el.checked ? 'Assistente com IA ativado' : 'Modo local ativado'); },
  toggleInfl: el => commit(s => { s.config.considerarInflacao = el.checked; }, el.checked ? 'Valores em poder de compra de hoje' : 'Valores nominais'),
  ask: el => { if (ui.aiBusy) return; const q = PERGUNTAS.find(p => p[0] === el.dataset.k); perguntar(q[1], q[0]); },
  exportar: () => baixar('atlas-backup-' + hoje() + '.json', exportarTexto()),
  copiar: () => { const t = exportarTexto(); const fallback = () => { const ta = $('#importText'); if (ta) { ta.value = t; ta.select(); toast('Selecionado. Copie com Ctrl+C'); } }; try { navigator.clipboard.writeText(t).then(() => toast('JSON copiado'), fallback); } catch (e) { fallback(); } },
  importarTexto: () => { const t = $('#importText').value.trim(); if (!t) { $('#importErr').innerHTML = '<p class="err">Cole o conteúdo do backup.</p>'; return; } importar(t); },
  apagarTudo: () => confirmar({ titulo: 'Apagar o planejamento?', corpo: '<p>Objetivos, itens manuais e premissas do Atlas serão apagados da nuvem. Os dados do painel não são afetados.</p>', ok: 'Apagar tudo', perigo: true, acao: () => { S = estadoVazio(); salvar(); ui.chat = []; go('diagnostico'); toast('Dados apagados'); } }),
  retry: () => { if (Nuvem.status === 'err') Nuvem.enviar(); else if (Nuvem.status === 'off') location.reload(); else Nuvem.atualizar().then(() => toast('Dados atualizados')); },
  tema: () => { const atual = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); const n = atual === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = n; try { localStorage.setItem('mf_theme', n); } catch (e) { /* ok */ } drawContours(); },
  formModo: el => { const g = el.parentNode; g.dataset.v = el.dataset.v; $$('button', g).forEach(b => b.setAttribute('aria-pressed', b === el)); $('#g-manual').hidden = el.dataset.v !== 'manual'; $('#g-painel').hidden = el.dataset.v !== 'painel'; },
  toggleUsarPainel: el => commit(s => { s.config.usarPainel = el.checked; }, el.checked ? 'Usando os dados do painel' : 'Dados do painel desligados'),
  usarRent: el => { const v = +el.dataset.v; confirmar({ titulo: 'Usar a rentabilidade do painel?', corpo: '<p>Rentabilidade do cenário base: ' + pct(S.config.cenarios.base.rentabilidade) + ' → <b>' + pct(v) + '</b> ao ano. Os outros cenários não mudam.</p>', ok: 'Aplicar', acao: () => commit(s => { s.config.cenarios.base.rentabilidade = Math.round(v * 10000) / 10000; }, 'Premissa atualizada') }); },
  sair: async () => { try { await Nuvem.sb.auth.signOut(); } catch (e) { /* ok */ } try { localStorage.removeItem(CACHE); } catch (e) { /* ok */ } location.reload(); },
  closeModal: () => fecharModal(),
  closeModalScrim: (el, e) => { if (e.target === el) fecharModal(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.type === 'checkbox') { fn(el, e); return; }
  if (el.dataset.act !== 'closeModalScrim') e.preventDefault();
  fn(el, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form'); if (!f) return;
  e.preventDefault();
  if (f.dataset.form === 'modal' && ui.modal) { if (ui.modal.onSubmit() !== false) fecharModal(); }
  if (f.dataset.form === 'login') { entrar(); return; }
  if (f.dataset.form === 'chat') { const t = $('#chatText').value.trim(); if (t && !ui.aiBusy) perguntar(t); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.sim) simInput(el);
  if (el.dataset.input === 'rendaDelta') { ui.rendaDelta = +el.value / 100; $('#rendaDeltaLbl').textContent = (ui.rendaDelta >= 0 ? '+' : '') + pct(ui.rendaDelta, 0); $('#rendaWhatIf').innerHTML = rendaWhatIf(ctx()); }
});
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset.change; if (!k) return;
  if (k === 'mapa') { const key = el.dataset.key, v = el.value; commit(s => { s.config.mapa = Object.assign({}, s.config.mapa, { [key]: v }); }, 'Classificação atualizada'); return; }
  if (k === 'capManual') { const v = num(el.value); if (fin(v) && v >= 0) commit(s => { s.config.capacidadeManual = v; }, 'Capacidade atualizada'); }
  if (k === 'simGoal') { ui.sim = simDe(V().objetivos.find(x => x.id === el.value)); render(); }
  if (k === 'cen') { const v = num(el.value) / 100; if (!fin(v) || v <= -1) { toast('Use um valor maior que −100%'); render(); return; } commit(s => { s.config.cenarios[el.dataset.cen][el.dataset.f] = v; }, 'Premissa atualizada'); }
  if (k === 'limiar') { const v = num(el.value); if (fin(v) && v >= 50 && v < 100) commit(s => { s.config.limiarRevisao = v / 100; }, 'Regra atualizada'); else { toast('Use um valor entre 50% e 99%'); render(); } }
  if (k === 'importFile') { const f = el.files && el.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => importar(String(r.result)); r.onerror = () => toast('Não foi possível ler o arquivo'); r.readAsText(f); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.modal) fecharModal();
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'chatText') { e.preventDefault(); e.target.form.requestSubmit(); }
});
document.addEventListener('pointermove', e => { if (e.target.closest && e.target.closest('.chart')) chartHover(e); });
document.addEventListener('pointerout', e => { if (e.target.closest && e.target.closest('.chart') && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.chart') === e.target.closest('.chart'))) chartLeave(e); });

let toastT;
function toast(t) { clearTimeout(toastT); $('#toastRoot').innerHTML = '<div class="toast" role="status">' + esc(t) + '</div>'; toastT = setTimeout(() => { $('#toastRoot').innerHTML = ''; }, 2600); }

/* =================== Curvas de nível do topo =================== */
function drawContours() {
  const cv = $('#contour'); if (!cv) return;
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const cor = css.getPropertyValue('--accent').trim() || '#0D6B57';
  g.strokeStyle = cor; g.lineWidth = 1;
  const centros = [[r.width * 0.86, r.height * 0.25, 1], [r.width * 0.62, r.height * 1.1, 0.7]];
  centros.forEach(([cx, cy, s], ci) => {
    for (let k = 1; k <= 11; k++) {
      const R = k * 19 * s + 8;
      g.globalAlpha = 0.05 + (k % 4 === 0 ? 0.13 : 0.07);
      g.beginPath();
      for (let t = 0; t <= Math.PI * 2 + 0.01; t += 0.05) {
        const w = 1 + 0.13 * Math.sin(3 * t + k * 0.35 + ci) + 0.07 * Math.sin(5 * t - k * 0.5) + 0.04 * Math.cos(2 * t + k);
        const x = cx + Math.cos(t) * R * w * 1.25, y = cy + Math.sin(t) * R * w * 0.82;
        t ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.stroke();
    }
  });
  g.globalAlpha = 1;
}
let resizeT, larguraAnt = window.innerWidth;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { const w = window.innerWidth; if ((w < 640) !== (larguraAnt < 640)) { larguraAnt = w; render(); } else drawContours(); }, 150); });
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawContours); } catch (e) { /* ok */ }
new MutationObserver(drawContours).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* =================== Início =================== */
function aplicarTema() {
  let th = null; try { th = localStorage.getItem('mf_theme'); } catch (e) { /* ok */ }
  if (th === 'dark' || th === 'light') document.documentElement.dataset.theme = th; else delete document.documentElement.dataset.theme;
}
window.addEventListener('storage', e => { if (e.key === 'mf_theme') { aplicarTema(); drawContours(); } });
function tela(html) { telaAtual = html; render(); }
function telaLogin(msg) {
  tela('<div class="card login-card stack" style="gap:16px"><div><div class="eyebrow">Atlas · planejamento</div><h1 style="margin-top:6px">Entre com a conta do painel</h1><p class="lede">O Atlas usa o mesmo login do Painel financeiro. Se você já entrou no painel neste navegador, basta abri-lo e voltar.</p></div>' +
    '<form data-form="login" class="stack" style="gap:12px" autocomplete="on"><div class="field"><label for="lgEmail">E-mail</label><input class="input" type="email" id="lgEmail" autocomplete="username" required></div>' +
    '<div class="field"><label for="lgPass">Senha</label><input class="input" type="password" id="lgPass" autocomplete="current-password" required></div>' +
    '<div id="lgMsg" class="err" role="alert">' + esc(msg || '') + '</div>' +
    '<div class="btn-row"><button class="btn btn-primary" type="submit" id="lgGo">Entrar</button><a class="btn" href="' + PAINEL_URL + '">Abrir o painel</a></div></form></div>');
}
function telaAviso(titulo, corpo, botoes) {
  tela('<div class="card login-card stack" style="gap:14px"><div class="eyebrow">Atlas · planejamento</div><h1>' + titulo + '</h1><div class="lede stack" style="gap:10px">' + corpo + '</div><div class="btn-row">' + (botoes || '<button class="btn btn-primary" onclick="location.reload()">Tentar de novo</button><a class="btn" href="' + PAINEL_URL + '">Abrir o painel</a>') + '</div></div>');
}
async function entrar() {
  const msg = t => { const el = $('#lgMsg'); if (el) el.textContent = t; };
  const email = $('#lgEmail').value.trim(), pass = $('#lgPass').value;
  if (!email || !pass) { msg('Informe e-mail e senha.'); return; }
  const b = $('#lgGo'); b.disabled = true; b.textContent = 'Entrando…';
  const { data, error } = await Nuvem.sb.auth.signInWithPassword({ email, password: pass });
  b.disabled = false; b.textContent = 'Entrar';
  if (error) { msg(/invalid/i.test(error.message) ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar: ' + error.message); return; }
  Nuvem.user = data.user; await abrir();
}
const SQL_FALTANDO = '<p>Falta criar a tabela <b>atlas</b> no Supabase. Abra o projeto no Supabase, vá em <b>SQL Editor</b>, cole o conteúdo do arquivo <b>atlas_setup.sql</b> e clique em <b>Run</b>. Depois recarregue esta página.</p>';
async function abrir() {
  telaAtual = null; Nuvem.setStatus('load');
  $('#main').innerHTML = '<div class="page"><div class="empty">Carregando seu planejamento…</div></div>';
  try {
    const d = await Nuvem.carregar();
    P = (d && d.resumo) || null;
    if (d && d.plano) { S = normalizar(d.plano); Nuvem.planoEm = d.plano_em || ''; }
    Nuvem.readonly = false; Nuvem.guardarCache(); Nuvem.setStatus('ok');
  } catch (e) {
    if (e && (e.code === 'PGRST205' || e.code === '42P01' || /relation .*atlas|atlas/.test(e.message || ''))) { telaAviso('Falta um passo no Supabase', SQL_FALTANDO); return; }
    let c = null; try { c = JSON.parse(localStorage.getItem(CACHE) || 'null'); } catch (x) { /* ok */ }
    if (c && c.uid === Nuvem.user.id) { P = c.resumo || null; if (c.plano) S = normalizar(c.plano); Nuvem.readonly = true; Nuvem.setStatus('off', e.message); toast('Sem conexão: mostrando a cópia do último acesso, só para leitura.'); }
    else { telaAviso('Não consegui carregar o planejamento', '<p>' + esc((e && e.message) || String(e)) + '</p>'); return; }
  }
  if (ui.view === 'objetivo') ui.view = 'objetivos';
  render();
}
async function iniciar() {
  aplicarTema();
  cap('sample').then(x => { ui.iaDisponivel = !!x; if (ui.view === 'assistente' && !telaAtual) render(); });
  if (!window.supabase) {
    let c = null; try { c = JSON.parse(localStorage.getItem(CACHE) || 'null'); } catch (x) { /* ok */ }
    if (c && c.plano) { Nuvem.user = { id: c.uid }; P = c.resumo || null; S = normalizar(c.plano); Nuvem.readonly = true; Nuvem.setStatus('off'); render(); return; }
    telaAviso('Sem conexão', '<p>Não foi possível carregar as bibliotecas da internet. Conecte-se e recarregue a página.</p>'); return;
  }
  const cfg = sbCfg();
  if (!cfg.url || !cfg.key) { telaAviso('Painel não configurado', '<p>Abra o painel neste navegador primeiro, para que ele guarde os dados de acesso ao Supabase.</p>'); return; }
  Nuvem.conectar(cfg);
  Nuvem.sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && Nuvem.user) { Nuvem.user = null; telaLogin('Sua sessão terminou. Entre de novo.'); } });
  let sess = null; try { sess = (await Nuvem.sb.auth.getSession()).data.session; } catch (e) { /* ok */ }
  if (!sess) { telaLogin(); return; }
  Nuvem.user = sess.user; await abrir();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Nuvem.atualizar(); });
window.addEventListener('beforeunload', e => { if (Nuvem.dirty || Nuvem.syncing) { e.preventDefault(); e.returnValue = ''; } });
marcarSalvo();
iniciar();
})();

</script>

</body>
</html>
